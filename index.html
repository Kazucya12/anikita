<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniKita — Anime Sub Indo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎬</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0d14;--bg2:#0e1320;--card:#141a29;--card2:#1b2338;--text:#eef1f8;--muted:#8a93ab;--line:#232c44;--accent:#7c5cff;--accent2:#ff4d8d;--gold:#ffc94d;--green:#34d399;--shadow:0 12px 32px rgba(0,0,0,.45)}
body.light{--bg:#f2f4fb;--bg2:#fff;--card:#fff;--card2:#eef1f8;--text:#1a2233;--muted:#5b6478;--line:#dbe2f0;--shadow:0 10px 28px rgba(40,50,100,.14)}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
[hidden]{display:none!important}
img{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit}
a{color:inherit}
.container{max-width:1280px;margin:0 auto;padding:0 22px}
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 22px;height:64px;display:flex;align-items:center;gap:26px}
.logo{font-size:1.45rem;font-weight:900;letter-spacing:-.5px}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:6px;list-style:none;flex:1}
.nav-links a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 13px;border-radius:10px;transition:.2s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--card2)}
.nav-actions{display:flex;gap:10px;margin-left:auto}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--muted);transition:.2s;font-size:1.05rem}
.icon-btn:hover{color:var(--text)}
.hamburger{display:none}
.fav-badge{position:absolute;top:-2px;right:-4px;background:var(--accent2);color:#fff;font-size:.62rem;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media(max-width:800px){.nav-links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 22px}.nav-links.open{display:flex}.hamburger{display:flex}}

.hero{position:relative;height:72vh;min-height:500px;max-width:1280px;margin:0 auto 34px;border-radius:0 0 28px 28px;overflow:hidden;background:var(--card)}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;align-items:center;justify-content:space-between;padding:0 7%;gap:30px}
.hero-slide.active{opacity:1}
.hero-slide::before{content:'';position:absolute;inset:-30px;background:var(--img) center/cover;filter:blur(26px) brightness(.7)}
.hero-slide::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,transparent 45%),linear-gradient(to right,rgba(0,0,0,.6),transparent 70%)}
.hero-inner{position:relative;z-index:2;max-width:600px;color:#fff}
.hero-poster{position:relative;z-index:2;height:78%;aspect-ratio:2/3;object-fit:cover;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.hero-tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:1.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:99px;margin-bottom:16px}
.hero-inner h1{font-size:clamp(1.8rem,4vw,3.1rem);font-weight:900;line-height:1.1;letter-spacing:-1px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.h-jp{font-size:1rem;opacity:.75;margin-bottom:6px;font-weight:600}
.hero-inner p{margin:14px 0 24px;opacity:.92;line-height:1.65;font-size:.96rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:13px 26px;border-radius:14px;font-weight:800;font-size:.92rem;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.35)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:46px;height:46px;border-radius:50%;background:rgba(10,13,20,.45);color:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center}
.hero-arrow:hover{background:var(--accent)}
.hero-arrow.prev{left:18px}.hero-arrow.next{right:18px}
.hero-dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px}
.hero-dots button{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.4);transition:.3s}
.hero-dots button.on{width:28px;background:#fff}
@media(max-width:700px){.hero-arrow,.hero-poster{display:none}.hero-slide{padding:0 24px}}

section{margin-bottom:44px;scroll-margin-top:80px}
.sec-title{display:flex;align-items:center;gap:12px;font-size:1.3rem;font-weight:800;margin-bottom:18px}
.sec-title::before{content:'';width:5px;height:24px;border-radius:99px;background:linear-gradient(var(--accent),var(--accent2))}
.day-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.day-pills button,.chips button{padding:9px 18px;border-radius:99px;font-weight:700;font-size:.82rem;background:var(--card);border:1px solid var(--line);color:var(--muted);transition:.2s}
.day-pills button:hover,.chips button:hover{color:var(--text)}
.day-pills button.on,.chips button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.day-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;max-height:460px;overflow:auto;padding-right:4px}
.day-item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;transition:.2s}
.day-item:hover{transform:translateX(6px);border-color:var(--accent)}
.day-item img{width:46px;height:64px;border-radius:8px;object-fit:cover;background:var(--card2);flex-shrink:0}
.day-item b{font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day-item small{color:var(--muted);display:block;margin-top:2px}
.air{margin-left:auto;background:var(--card2);padding:6px 12px;border-radius:10px;font-weight:700;font-size:.78rem;color:var(--accent);white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input,.toolbar select{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:.9rem;outline:none}
.search input{width:100%;padding-left:42px}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
.toolbar select{font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chips button{padding:8px 16px;font-size:.8rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:20px}
.card{cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-6px)}
.poster{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--card2);box-shadow:var(--shadow)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 50%)}
.badge{position:absolute;z-index:2;top:10px;left:10px;font-size:.6rem;font-weight:800;letter-spacing:1px;padding:4px 9px;border-radius:7px;color:#fff;background:#64748b}
.b-air{background:var(--green)}.b-soon{background:var(--accent2)}
.ep-badge{position:absolute;z-index:2;left:12px;bottom:12px;font-size:.7rem;font-weight:800;color:#fff;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:7px}
.fav-btn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.45);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;z-index:3;transition:.2s}
.fav-btn:hover{background:var(--accent2)}
.fav-btn.on{color:var(--accent2)}
.hover-play{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:.25s}
.card:hover .hover-play{opacity:1}
.hover-play span{width:56px;height:56px;border-radius:50%;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem}
.card-body{padding:10px 4px 0}
.card-body h3{font-size:.92rem;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:8px;font-size:.76rem;color:var(--muted)}
.star{color:var(--gold);font-weight:800}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted)}
.more{display:block;margin:28px auto 0}
.skel{background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:16px;aspect-ratio:2/3}
@keyframes sh{to{background-position:-200% 0}}

.modal{position:fixed;inset:0;z-index:200;background:rgba(5,7,12,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.detail-panel{background:var(--bg2);border:1px solid var(--line);border-radius:24px;max-width:860px;width:100%;max-height:92vh;overflow-y:auto;position:relative;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.95) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.55);color:#fff;z-index:5}
.modal-close:hover{background:var(--accent2)}
.detail-hero{height:230px;position:relative;background:var(--img) center/cover}
.detail-hero::before{content:'';position:absolute;inset:0;backdrop-filter:blur(14px);background:rgba(0,0,0,.35)}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg2),transparent 75%)}
.detail-hero h2{position:absolute;bottom:18px;left:26px;right:70px;color:#fff;font-size:1.6rem;font-weight:900;z-index:2;text-shadow:0 3px 16px rgba(0,0,0,.6)}
.d-jp{position:absolute;bottom:60px;left:26px;color:rgba(255,255,255,.75);font-size:.85rem;z-index:2}
.detail-body{padding:20px 26px 28px}
.d-rating{display:inline-flex;gap:8px;background:var(--card2);padding:8px 16px;border-radius:12px;font-weight:800;color:var(--gold);margin-bottom:14px}
.d-rating small{color:var(--muted);font-weight:600}
.d-meta,.d-genres,.links,.d-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.d-meta span{background:var(--card2);padding:6px 13px;border-radius:10px;font-size:.78rem;font-weight:700;color:var(--muted)}
.d-meta b{color:var(--text)}
.d-syn{line-height:1.75;color:var(--muted);font-size:.93rem;margin-bottom:16px;white-space:pre-line}
.d-genres span{font-size:.74rem;font-weight:800;padding:6px 13px;border-radius:99px;background:rgba(124,92,255,.14);color:var(--accent);border:1px solid rgba(124,92,255,.3)}
.btn-fav{padding:12px 22px;border-radius:14px;font-weight:800;font-size:.9rem;border:1px solid var(--line);background:var(--card2);transition:.2s}
.btn-fav:hover,.btn-fav.on{border-color:var(--accent2);color:var(--accent2)}
.eps-title{font-size:.95rem;font-weight:800;margin:20px 0 10px}
.vid iframe,.own video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}
.links a{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-decoration:none;font-weight:700;font-size:.85rem;color:var(--accent)}
.links a:hover{border-color:var(--accent)}
.own{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:20px}
.own summary{cursor:pointer;font-weight:800;font-size:.92rem}
.own .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.own input[type=text]{flex:1;min-width:180px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}
.own small{display:block;color:var(--muted);margin-top:10px;line-height:1.5}
.eps-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.ep-row{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.86rem}
.ep-row:last-child{border:0}
.ep-row b{color:var(--accent);min-width:28px}
.ep-row span{color:var(--muted)}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);padding:14px 20px;border-radius:14px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);animation:pop .3s}
footer{border-top:1px solid var(--line);margin-top:60px;padding:34px 22px;text-align:center;color:var(--muted);font-size:.82rem;line-height:1.8}
footer b{color:var(--text)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.detail-hero{height:180px}.detail-body{padding:18px}.day-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner">
  <div class="logo">Ani<span>Kita</span></div>
  <ul class="nav-links" id="navLinks">
    <li><a href="#jelajahi" id="navAll" class="active">Jelajahi</a></li>
    <li><a href="#jadwal">Jadwal Rilis</a></li>
    <li><a href="#" id="navFav">Watchlist<span class="fav-badge" id="favBadge" hidden>0</span></a></li>
  </ul>
  <div class="nav-actions">
    <button class="icon-btn" id="themeBtn" title="Ganti tema">🌙</button>
    <button class="icon-btn hamburger" id="hamburger">☰</button>
  </div>
</div></nav>

<header class="hero" id="hero">
  <div id="heroSlides"></div>
  <button class="hero-arrow prev" id="heroPrev">‹</button>
  <button class="hero-arrow next" id="heroNext">›</button>
  <div class="hero-dots" id="heroDots"></div>
</header>

<main class="container">
  <section id="jadwal">
    <h2 class="sec-title">Jadwal Rilis Mingguan</h2>
    <div class="day-pills" id="dayPills"></div>
    <div class="day-list" id="dayList"></div>
  </section>
  <section id="jelajahi">
    <h2 class="sec-title" id="gridHeading">Jelajahi Anime</h2>
    <div class="toolbar">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="q" placeholder="Cari judul… (tekan /)" aria-label="Cari judul">
      </div>
      <select id="statusSel" aria-label="Status"><option value="">Semua Status</option><option value="airing">Sedang Tayang</option><option value="complete">Tamat</option><option value="upcoming">Akan Tayang</option></select>
      <select id="sortSel" aria-label="Urutkan"><option value="score">Rating Tertinggi</option><option value="popularity">Terpopuler</option><option value="start_date">Terbaru</option><option value="title">Judul A–Z</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <button class="btn btn-primary more" id="moreBtn" hidden>Muat lebih banyak</button>
  </section>
</main>

<footer><b>AniKita</b> — data dari MyAnimeList lewat Jikan API.<br>Episode ditonton lewat platform resmi; trailer dan link resmi tersedia di halaman detail.</footer>

<div class="modal" id="detailModal"><div class="detail-panel"><button class="modal-close" id="closeDetail" aria-label="Tutup">✕</button><div id="detailBody"></div></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/app.js"></script>
</body>
</html>
