<header><div class="hr"><a class="logo" href="#/">KUMORI</a><div class="seg"><a id="ta" href="#/">Anime</a><a id="tm" href="#/m">Manga</a></div><a class="ib" href="#/set" aria-label="Pengaturan">⚙</a></div>

<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>{try{return JSON.parse(localStorage.getItem('k'))||{}}catch{return{}}};
const F='id title{romaji english} synonyms coverImage{large}averageScore episodes status genres seasonYear description nextAiringEpisode{episode} trailer{id site} externalLinks{url site type} streamingEpisodes{title url site}';
const gql=async(q,v)=>{
  const body=JSON.stringify({query:q,variables:v});
  const go=async url=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body});const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('Respons AniList bukan JSON ('+r.status+')')}if(j.errors)throw Error(j.errors[0].message);if(!r.ok)throw Error('AniList HTTP '+r.status);return j.data};
  try{return await go('/api/anilist')}catch(e1){
    try{return await go('https://graphql.anilist.co')}
    catch(e2){throw Error('Tidak bisa terhubung ke AniList. Cek koneksi/VPN/adblock, atau pastikan folder api/ ikut ter-deploy. ('+(e2.message||e1.message)+')')}
  }
};
const T=m=>m.title.english||m.title.romaji;
const card=m=>`<a class="c" href="#/a/${m.id}"><div class="im" style="background-image:url('${E(m.coverImage.large)}')">${m.averageScore?`<span class="bd">★ ${(m.averageScore/10).toFixed(1)}</span>`:''}${m.nextAiringEpisode?`<span class="bd b2">Eps ${m.nextAiringEpisode.episode-1}</span>`:''}</div><div class="nm">${E(T(m))}</div></a>`;
const grid=l=>`<div class="g">${l.map(card).join('')}</div>`;
let hls;
const OFF=m=>{const L=(m.externalLinks||[]).filter(x=>x.type==='STREAMING');return L.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">'+L.map(x=>`<a class="btn s" target="_blank" rel="noopener" href="${E(x.url)}">${E(x.site)} ↗</a>`).join('')+'</div>':'<div class="mu" style="margin-top:8px">Belum ada link resmi di AniList.</div>'};
const TR=m=>m.trailer&&m.trailer.site==='youtube'?`<button class="btn" id="tr">▶ Trailer</button> `:'';

 
const hist=()=>{try{return JSON.parse(localStorage.getItem('kw'))||{}}catch{return{}}};
const SY=t=>`<div class="sec"><h3 class="sh">Sinopsis</h3><div class="sy c3">${t||'<span class="mu">Sinopsis belum tersedia.</span>'}</div><button class="lk">Baca selengkapnya</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('.lk');if(b){const o=b.previousElementSibling.classList.toggle('c3');b.textContent=o?'Baca selengkapnya':'Tutup'}});
const SK=`<div class="g">${'<div class="c"><div class="im sk"></div><div class="nm sk" style="height:14px;margin-top:8px"></div></div>'.repeat(12)}</div>`;
const setNav=()=>{const h=location.hash||'#/';const mg=/^#\/(m|ms|r)(\/|$)/.test(h);$('#ta').classList.toggle('on',!mg);$('#tm').classList.toggle('on',mg);$('#nv').style.display=mg?'none':'flex';$('#si').placeholder=mg?'Cari manga…':'Cari anime…';document.querySelectorAll('#nv a').forEach(a=>{const k=a.getAttribute('href');a.classList.toggle('on',k==='#/'?(h==='#/'||/^#\/(a|s)(\/|$)/.test(h)):h.startsWith(k))})};
function contWatch(){const l=Object.entries(hist()).sort((x,y)=>y[1].ts-x[1].ts).slice(0,10);return l.length?`<h2>▶ Lanjutkan Menonton</h2><div class="hs">${l.map(([id,x])=>`<a class="c" href="#/a/${id}"><div class="im" style="background-image:url('${E(x.c)}')"><span class="bd b2">Eps ${x.e}</span></div><div class="nm">${E(x.t)}</div></a>`).join('')}</div>`:''}
// Sanka proxy: API upstream dipanggil dari Vercel Function agar tidak terkena CORS.
async function sankaFetch(path){
  const r=await fetch('/api/sanka?p='+encodeURIComponent(path));
  const raw=await r.text();
  let j; try{j=JSON.parse(raw)}catch{throw Error('Respons Sanka bukan JSON ('+r.status+').')}
  if(!r.ok) throw Error((j&&j.message)||('Sanka API HTTP '+r.status));
  if(j&&j.status==='error') throw Error(j.message||'Sanka API gagal');
  if(j&&!j.data&&j.message) throw Error(j.message);
  return j&&j.data!==undefined?j.data:j;
}
const SRC={
  sh:{name:'Samehadaku',search:q=>['/samehadaku/search?q='+encodeURIComponent(q),'/samehadaku/search/'+encodeURIComponent(q)],anime:'/samehadaku/anime/',ep:'/samehadaku/episode/',sv:'/samehadaku/server/',site:'https://v2.samehadaku.how'},
  ota:{name:'Otakudesu',ep:'/anime/episode/',sv:'/anime/server/',site:'https://otakudesu.blog'}
};
function sankaQueries(titles){
  const out=[];
  const add=x=>{x=String(x||'').replace(/\s+/g,' ').trim();if(x&&!out.includes(x))out.push(x)};
  (titles||[]).filter(Boolean).forEach(t=>{
    const clean=String(t).replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
    const base=clean.replace(/\b(\d+(st|nd|rd|th)\s+season|season\s*\d+|part\s*\d+|cour\s*\d+)\b/ig,' ').replace(/\s+/g,' ').trim();
    add(clean);
    add(base);
    add(base.split(' ').slice(0,4).join(' '));
    add(base.split(' ').slice(0,3).join(' '));
    add(base.split(' ').slice(0,2).join(' '));
    add(base.split(' ')[0]);
  });
  return out;
}
function sankaNorm(t){return String(t||'').toLowerCase().replace(/on-going|subtitle indonesia|sub indo/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function sankaSeason(t){const m=String(t||'').toLowerCase().match(/(\d+)(?:st|nd|rd|th)\s+season|season\s*(\d+)|\bs(\d+)\b/);return m?+(m[1]||m[2]||m[3]):1}
function sankaScore(cand,titles){
  const ct=sankaNorm(cand),cs=new Set(ct.split(' '));let best=0;
  titles.filter(Boolean).forEach(t=>{
    const tt=sankaNorm(t),ts=new Set(tt.split(' '));
    let inter=0;ts.forEach(w=>{if(cs.has(w))inter++});
    let sc=inter/Math.max(1,new Set([...ts,...cs]).size);
    if(ct===tt)sc+=1;
    if(sankaSeason(cand)===sankaSeason(t))sc+=0.15;else sc-=0.15;
    if(sc>best)best=sc;
  });
  return best;
}
async function sankaAutoEpisode(titles,ep){
  titles=[].concat(titles||[]).filter(Boolean);
  let best=null,lastErr=null;
  for(const q of sankaQueries(titles)){
    let data=null;
    for(const path of SRC.sh.search(q)){
      try{data=await sankaFetch(path);break}catch(e){lastErr=e}
    }
    if(!data)continue;
    const results=walkObjects(data).filter(o=>o.title&&o.animeId);
    if(!results.length)continue;
    results.forEach(o=>{o._sc=sankaScore(o.title,titles)-(/batch|episode\s*\d/i.test(o.title)?0.3:0)});
    results.sort((x,y)=>y._sc-x._sc);
    if(!best||results[0]._sc>best._sc)best=results[0];
    if(best._sc>=0.5)break;
  }
  if(!best||best._sc<0.25)throw Error((lastErr&&lastErr.message)||'Anime tidak ditemukan di katalog Samehadaku melalui Sanka.');
  window.shUrl=best.samehadakuUrl||'';
  const detail=await sankaFetch(SRC.sh.anime+encodeURIComponent(best.animeId));
  const eps=walkObjects(detail).filter(o=>o.episodeId);
  const re=new RegExp('(episode|ep)\\.?\\s*0*'+ep+'(?!\\d)','i');
  const hit=eps.find(o=>String(o.eps)===String(ep))
    ||eps.find(o=>re.test(String(o.title||'')))
    ||eps.find(o=>new RegExp('-episode-0*'+ep+'$','i').test(String(o.episodeId)));
  if(hit)return String(hit.episodeId);
  // detail tidak memuat daftar episode: tebak dari pola ID Samehadaku
  return best.animeId+'-episode-'+ep;
}
const sankaEpisode=(slug,src='sh')=>sankaFetch(SRC[src].ep+encodeURIComponent(slug));
const sankaServer=(id,src='sh')=>sankaFetch(SRC[src].sv+encodeURIComponent(id));
function walkObjects(value,out=[]){
  if(!value||typeof value!=='object')return out;
  if(Array.isArray(value)){value.forEach(x=>walkObjects(x,out));return out;}
  out.push(value);Object.values(value).forEach(x=>{if(x&&typeof x==='object')walkObjects(x,out)});return out;
}
function findVideo(value){
  if(!value||typeof value!=='object')return '';
  for(const k of ['defaultStreamingUrl','streamingUrl','streamUrl','stream_url']){
    const v=value[k];if(typeof v==='string'&&/^https?:\/\//i.test(v))return v;
  }
  const rest=Array.isArray(value)?value:Object.fromEntries(Object.entries(value).filter(([k])=>k!=='downloadUrl'));
  const objs=walkObjects(rest);
  for(const o of objs){
    for(const k of ['url','link','file','src','embed','iframe']){
      const v=o[k];if(typeof v==='string'&&/^https?:\/\//i.test(v)&&!/otakudesu\.|desustream\.com\/\?id=/i.test(v))return v;
    }
  }
  return '';
}
function episodeServerButtons(data){
  const items=[];
  const qs=(data&&data.server&&data.server.qualities)||[];
  qs.forEach(q=>(q.serverList||[]).forEach(sv=>{
    if(sv&&sv.serverId){const nm=String(sv.title||'').trim(),ql=String(q.title||'').trim();items.push({id:String(sv.serverId),name:ql&&!nm.toLowerCase().includes(ql.toLowerCase())?nm+' '+ql:nm});}
  }));
  return [...new Map(items.map(x=>[x.id,x])).values()];
}
async function playSankaEpisode(slug,title,src='sh'){
  const box=$('#pl'); if(!box)return;
  box.innerHTML='<div class="msg">Menghubungkan ke Sanka API ('+SRC[src].name+')…</div>';
  try{
    const data=await sankaEpisode(slug,src);
    const direct=findVideo(data);
    const servers=episodeServerButtons(data);
    if(direct){
      renderSankaSource(box,direct);
      if(servers.length){
        let bar=document.getElementById('sanka-bar');
        if(!bar){bar=document.createElement('div');bar.id='sanka-bar';box.parentNode.insertBefore(bar,box.nextSibling)}
        bar.innerHTML='<div class="chips" id="sanka-servers">'+servers.map(x=>`<button class="chip" data-sanka-server="${E(x.id)}">${E(x.name)}</button>`).join('')+'</div><p class="mu" id="sanka-status">Server lain bila video tidak jalan.</p>';
        bar.querySelector('#sanka-servers').onclick=async ev=>{
          const b=ev.target.closest('[data-sanka-server]');if(!b)return;
          bar.querySelector('#sanka-status').textContent='Memuat server '+b.textContent+'…';
          try{const d=await sankaServer(b.dataset.sankaServer,src);const u=findVideo(d);
            if(!u)throw Error('Server tidak mengembalikan URL video yang dikenali.');
            renderSankaSource(box,u);bar.querySelector('#sanka-status').textContent='Server: '+b.textContent;
          }catch(e){bar.querySelector('#sanka-status').textContent='Gagal memuat server: '+e.message;}
        };
      }
      return;
    }
    if(!servers.length)throw Error('Detail episode diterima, tetapi daftar server video tidak ditemukan pada respons API.');
    box.innerHTML='<div style="padding:16px;width:100%"><b>Pilih server video</b><div class="chips" id="sanka-servers">'+servers.map(x=>`<button class="chip" data-sanka-server="${E(x.id)}">${E(x.name)}</button>`).join('')+'</div><p class="mu" id="sanka-status">Pilih salah satu server untuk memuat video.</p></div>';
    $('#sanka-servers').onclick=async ev=>{
      const b=ev.target.closest('[data-sanka-server]');if(!b)return;
      $('#sanka-status').textContent='Memuat server '+b.textContent+'…';
      try{const d=await sankaServer(b.dataset.sankaServer,src);const u=findVideo(d);
        if(!u)throw Error('Server tidak mengembalikan URL video yang dikenali.');renderSankaSource(box,u);
      }catch(e){$('#sanka-status').textContent='Gagal memuat server: '+e.message;}
    };
  }catch(e){box.innerHTML=`<div class="msg">Tidak bisa memuat streaming Sanka.<br><small>${E(e.message)}</small><br><br><a class="btn s" target="_blank" rel="noopener" href="${E((src==='sh'&&window.shUrl)||SRC[src].site)}">Buka di ${E(SRC[src].name)} ↗</a></div>`;}
}
function renderSankaSource(box,url){setTimeout(()=>{const v=box.querySelector('video');if(v)v.onended=()=>window.nextEp&&window.nextEp()});
  if(/\.(m3u8)(\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){
    box.innerHTML='<video controls autoplay playsinline></video>';const v=box.querySelector('video');hls=new Hls();hls.loadSource(url);hls.attachMedia(v);
  }else if(/\.(mp4|webm|ogg)(\?|$)/i.test(url)){
    box.innerHTML='<video controls autoplay playsinline></video>';box.querySelector('video').src=url;
  }else{
    box.innerHTML=`<iframe src="${E(url)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
  }
}

let otakuCache=null;
async function otakuData(){
  if(otakuCache)return otakuCache;
  const [r,r2,r3]=await Promise.all([fetch('/data/otakudesu.json'),fetch('/data/otakudesu-detail.json'),fetch('/data/otakudesu-genres.json')]);

const chCache={};
async function getChapters(mid,lang){
  const key=mid+'|'+lang;if(chCache[key])return chCache[key];
  let all=[],off=0,total=1;
  while(off<total&&off<2000){
    const j=await mdFetch(`/manga/${mid}/feed?limit=500&offset=${off}&translatedLanguage[]=${lang}&order[chapter]=asc&includeExternalUrl=0${MR}`);
    all=all.concat(j.data);total=j.total||0;off+=500;if(!j.data.length)break;
  }
  const seen=new Set(),out=[];
  all.forEach(c=>{const a=c.attributes;if(a.externalUrl||a.pages===0)return;const k=a.chapter==null?c.id:a.chapter;if(seen.has(k))return;seen.add(k);out.push({id:c.id,num:a.chapter,title:a.title,vol:a.volume})});
  return chCache[key]=out;
}

async function route(){
  const h=location.hash||'#/';
  const p=h.replace(/^#\/?/,'').split('/').map(x=>{try{return decodeURIComponent(x)}catch{return x}});
  if(hls){try{hls.destroy()}catch{}hls=null}
  if(window._kd){window.removeEventListener('keydown',window._kd);window._kd=null}
  window.nextEp=null;
  setNav();window.scrollTo(0,0);
  try{
    switch(p[0]){
      case'':return await vHome();
      case'a':return await vAnime(p[1]);
      case's':return await vSearch(p.slice(1).join('/'));
      case'm':return p[1]?await vManga(p[1]):await vMangaHome();
      case'ms':return await vMangaSearch(p.slice(1).join('/'));
      case'r':return await vReader(p[1]);
      case'set':return vSettings();
      case'o':
        switch(p[1]){
          case'ongoing':return await vOtaList('ongoing');
          case'completed':return await vOtaList('completed');
          case'list':return await vOtaAll();
          case'genres':return await vOtaGenres();
          case'g':return await vOtaGenre(p[2],p[3]);
          case'schedule':return await vOtaSchedule();
          case'd':return await vOtaDetail(p[2]);
          case'e':return await vOtaEp(p[2]);
        }
    }
    app.innerHTML='<div class="msg">Halaman tidak ditemukan.<br><br><a class="btn" href="#/">Ke beranda</a></div>';
  }catch(e){console.error(e);app.innerHTML=errBox(e)}
}
$('#sf').addEventListener('submit',e=>{
  e.preventDefault();const q=$('#si').value.trim();if(!q)return;
  const mg=/^#\/(m|ms|r)(\/|$)/.test(location.hash||'#/');
  location.hash=(mg?'#/ms/':'#/s/')+enc(q);
});
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
