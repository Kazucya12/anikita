<script>
const $=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>{try{return JSON.parse(localStorage.getItem('k'))||{}}catch{return{}}};
const F='id title{romaji english}coverImage{large}averageScore episodes status genres seasonYear description nextAiringEpisode{episode} trailer{id site} externalLinks{url site type} streamingEpisodes{title url site}';
const gql=async(q,v)=>{const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:v})});const j=await r.json();if(j.errors)throw Error(j.errors[0].message);return j.data};
const T=m=>m.title.english||m.title.romaji;
const card=m=>`<a class="c" href="#/a/${m.id}"><div class="im" style="background-image:url('${E(m.coverImage.large)}')"></div><div class="nm">${E(T(m))}</div></a>`;
const grid=l=>`<div class="g">${l.map(card).join('')}</div>`;
let hls;
const OFF=m=>{const L=(m.externalLinks||[]).filter(x=>x.type==='STREAMING');return L.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">'+L.map(x=>`<a class="btn s" target="_blank" rel="noopener" href="${E(x.url)}">${E(x.site)} ↗</a>`).join('')+'</div>':'<div class="mu" style="margin-top:8px">Belum ada link resmi di AniList.</div>'};
const TR=m=>m.trailer&&m.trailer.site==='youtube'?`<button class="btn" id="tr">▶ Trailer</button> `:'';

 
// Sanka proxy: API upstream dipanggil dari Vercel Function agar tidak terkena CORS.
async function sankaFetch(path){
  const r=await fetch('/api/sanka?p='+encodeURIComponent(path));
  const raw=await r.text();
  let j; try{j=JSON.parse(raw)}catch{throw Error('Respons Sanka bukan JSON ('+r.status+').')}
  if(!r.ok) throw Error((j&&j.message)||('Sanka API HTTP '+r.status));
  if(j&&j.status==='error') throw Error(j.message||'Sanka API gagal');
  return j&&j.data!==undefined?j.data:j;
}
function sankaQueries(titles){
  const out=[];
  const add=x=>{x=String(x||'').replace(/\s+/g,' ').trim();if(x&&!out.includes(x))out.push(x)};
  (titles||[]).filter(Boolean).forEach(t=>{
    const clean=String(t).replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
    const base=clean.replace(/\b(\d+(st|nd|rd|th)\s+season|season\s*\d+|part\s*\d+|cour\s*\d+)\b/ig,' ').replace(/\s+/g,' ').trim();
    add(clean);
    add(base);
    add(base.split(' ').slice(0,4).join(' '));
    add(base.split(' ').slice(0,3).join(' '));
    add(base.split(' ').slice(0,2).join(' '));
    add(base.split(' ')[0]);
  });
  return out;
}
function sankaNorm(t){return String(t||'').toLowerCase().replace(/on-going|subtitle indonesia|sub indo/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function sankaSeason(t){const m=String(t||'').toLowerCase().match(/(\d+)(?:st|nd|rd|th)\s+season|season\s*(\d+)|\bs(\d+)\b/);return m?+(m[1]||m[2]||m[3]):1}
function sankaScore(cand,titles){
  const ct=sankaNorm(cand),cs=new Set(ct.split(' '));let best=0;
  titles.filter(Boolean).forEach(t=>{
    const tt=sankaNorm(t),ts=new Set(tt.split(' '));
    let inter=0;ts.forEach(w=>{if(cs.has(w))inter++});
    let sc=inter/Math.max(1,new Set([...ts,...cs]).size);
    if(ct===tt)sc+=1;
    if(sankaSeason(cand)===sankaSeason(t))sc+=0.15;else sc-=0.15;
    if(sc>best)best=sc;
  });
  return best;
}
async function sankaAutoEpisode(titles,ep){
  titles=[].concat(titles||[]).filter(Boolean);
  let best=null,lastErr=null;
  for(const q of sankaQueries(titles)){
    let data;
    try{data=await sankaFetch('/anime/search/'+encodeURIComponent(q))}catch(e){lastErr=e;continue}
    const results=walkObjects(data).filter(o=>o.title&&o.animeId);
    if(!results.length)continue;
    results.forEach(o=>{o._sc=sankaScore(o.title,titles)});
    results.sort((x,y)=>y._sc-x._sc);
    if(!best||results[0]._sc>best._sc)best=results[0];
    if(best._sc>=0.5)break;
  }
  if(!best||best._sc<0.25)throw Error((lastErr&&lastErr.message)||'Anime tidak ditemukan di katalog Otakudesu melalui Sanka.');
  const detail=await sankaFetch('/anime/anime/'+encodeURIComponent(best.animeId));
  const eps=walkObjects(detail).filter(o=>o.episodeId&&(o.eps!==undefined||o.title));
  const hit=eps.find(o=>String(o.eps)===String(ep))||eps.find(o=>new RegExp('(episode|ep)\\.?\\s*0*'+ep+'(?!\\d)','i').test(String(o.title||'')));
  if(!hit)throw Error('Episode '+ep+' tidak ditemukan pada daftar episode Otakudesu.');
  return String(hit.episodeId);
}
const sankaEpisode=slug=>sankaFetch('/anime/episode/'+encodeURIComponent(slug));
const sankaServer=id=>sankaFetch('/anime/server/'+encodeURIComponent(id));
function walkObjects(value,out=[]){
  if(!value||typeof value!=='object')return out;
  if(Array.isArray(value)){value.forEach(x=>walkObjects(x,out));return out;}
  out.push(value);Object.values(value).forEach(x=>{if(x&&typeof x==='object')walkObjects(x,out)});return out;
}
function findVideo(value){
  if(!value||typeof value!=='object')return '';
  for(const k of ['defaultStreamingUrl','streamingUrl','streamUrl','stream_url']){
    const v=value[k];if(typeof v==='string'&&/^https?:\/\//i.test(v))return v;
  }
  const rest=Array.isArray(value)?value:Object.fromEntries(Object.entries(value).filter(([k])=>k!=='downloadUrl'));
  const objs=walkObjects(rest);
  for(const o of objs){
    for(const k of ['url','link','file','src','embed','iframe']){
      const v=o[k];if(typeof v==='string'&&/^https?:\/\//i.test(v)&&!/otakudesu\.|desustream\.com\/\?id=/i.test(v))return v;
    }
  }
  return '';
}
function episodeServerButtons(data){
  const items=[];
  const qs=(data&&data.server&&data.server.qualities)||[];
  qs.forEach(q=>(q.serverList||[]).forEach(sv=>{
    if(sv&&sv.serverId)items.push({id:String(sv.serverId),name:String(sv.title||'').trim()+' '+String(q.title||'').trim()});
  }));
  return [...new Map(items.map(x=>[x.id,x])).values()];
}
async function playSankaEpisode(slug,title){
  const box=$('#pl'); if(!box)return;
  box.innerHTML='<div class="msg">Menghubungkan ke Sanka API…</div>';
  try{
    const data=await sankaEpisode(slug);
    const direct=findVideo(data);
    const servers=episodeServerButtons(data);
    if(direct){
      renderSankaSource(box,direct);
      if(servers.length){
        let bar=document.getElementById('sanka-bar');
        if(!bar){bar=document.createElement('div');bar.id='sanka-bar';box.parentNode.insertBefore(bar,box.nextSibling)}
        bar.innerHTML='<div class="chips" id="sanka-servers">'+servers.map(x=>`<button class="chip" data-sanka-server="${E(x.id)}">${E(x.name)}</button>`).join('')+'</div><p class="mu" id="sanka-status">Server lain bila video tidak jalan.</p>';
        bar.querySelector('#sanka-servers').onclick=async ev=>{
          const b=ev.target.closest('[data-sanka-server]');if(!b)return;
          bar.querySelector('#sanka-status').textContent='Memuat server '+b.textContent+'…';
          try{const d=await sankaServer(b.dataset.sankaServer);const u=findVideo(d);
            if(!u)throw Error('Server tidak mengembalikan URL video yang dikenali.');
            renderSankaSource(box,u);bar.querySelector('#sanka-status').textContent='Server: '+b.textContent;
          }catch(e){bar.querySelector('#sanka-status').textContent='Gagal memuat server: '+e.message;}
        };
      }
      return;
    }
    if(!servers.length)throw Error('Detail episode diterima, tetapi daftar server video tidak ditemukan pada respons API.');
    box.innerHTML='<div style="padding:16px;width:100%"><b>Pilih server video</b><div class="chips" id="sanka-servers">'+servers.map(x=>`<button class="chip" data-sanka-server="${E(x.id)}">${E(x.name)}</button>`).join('')+'</div><p class="mu" id="sanka-status">Pilih salah satu server untuk memuat video.</p></div>';
    $('#sanka-servers').onclick=async ev=>{
      const b=ev.target.closest('[data-sanka-server]');if(!b)return;
      $('#sanka-status').textContent='Memuat server '+b.textContent+'…';
      try{const d=await sankaServer(b.dataset.sankaServer);const u=findVideo(d);
        if(!u)throw Error('Server tidak mengembalikan URL video yang dikenali.');renderSankaSource(box,u);
      }catch(e){$('#sanka-status').textContent='Gagal memuat server: '+e.message;}
    };
  }catch(e){box.innerHTML=`<div class="msg">Tidak bisa memuat streaming Sanka.<br><small>${E(e.message)}</small><br><br><a class="btn s" target="_blank" rel="noopener" href="https://otakudesu.blog">Buka sumber Otakudesu</a></div>`;}
}
function renderSankaSource(box,url){
  if(/\.(m3u8)(\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){
    box.innerHTML='<video controls autoplay playsinline></video>';const v=box.querySelector('video');hls=new Hls();hls.loadSource(url);hls.attachMedia(v);
  }else if(/\.(mp4|webm|ogg)(\?|$)/i.test(url)){
    box.innerHTML='<video controls autoplay playsinline></video>';box.querySelector('video').src=url;
  }else{
    box.innerHTML=`<iframe src="${E(url)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
  }
}

let otakuCache=null;
async function otakuData(){
  if(otakuCache)return otakuCache;
  const [r,r2,r3]=await Promise.all([fetch('/data/otakudesu.json'),fetch('/data/otakudesu-detail.json'),fetch('/data/otakudesu-genres.json')]);
  if(!r.ok)throw Error('Data katalog Otakudesu tidak bisa dimuat ('+r.status+')');
  otakuCache=await r.json();
  otakuCache.detail=r2.ok?await r2.json():{};
  otakuCache.genres=r3.ok?await r3.json():[];
  return otakuCache;
}
const oLink=a=>(otakuCache&&otakuCache.detail[a.animeId])?`href="#/o/d/${encodeURIComponent(a.animeId)}"`:`href="${E(a.otakudesuUrl)}" target="_blank" rel="noopener noreferrer"`;
function otakuCard(a,completed){
  const meta=completed
    ? `${a.episodes||'?'} episode${a.score?' · ★ '+a.score:''}${a.lastReleaseDate?' · '+a.lastReleaseDate:''}`
    : `${a.episodes||'?'} episode${a.releaseDay?' · '+a.releaseDay:''}${a.latestReleaseDate?' · '+a.latestReleaseDate:''}`;
  return `<a class="c ota-card" ${oLink(a)}>
    <div class="im" style="background-image:url('${E(a.poster)}')"></div>
    <div class="nm">${E(a.title)}</div><div class="ota-meta">${E(meta)}</div>
  </a>`;
}

async function otakuSchedulePage(){
  const r=await fetch('/data/otakudesu-schedule.json');
  if(!r.ok)throw Error('Data jadwal anime tidak bisa dimuat ('+r.status+')');
  const days=await r.json();
  app.innerHTML=`<div class="ota-head"><h2>🗓️ Jadwal Anime</h2><span class="mu">Senin–Minggu</span></div>
    ${days.map(day=>`<section style="margin:18px 0">
      <h3 style="margin:0 0 10px">${E(day.day)}</h3>
      <div class="g">${(day.anime_list||[]).map(a=>`<a class="c ota-card" href="${E(a.url||('#/o/list'))}" target="_blank" rel="noopener noreferrer">
        <div class="im" style="background-image:url('${E(a.poster)}')"></div>
        <div class="nm">${E(a.title)}</div>
      </a>`).join('')}</div>
    </section>`).join('')}`;
}

async function otakuListPage(){
  const d=await otakuData(),list=d.animeList||[];
  app.innerHTML=`<div class="ota-head"><h2>📚 Daftar Anime</h2><span class="mu">${list.length} judul</span></div>
    <div class="g">${list.map(a=>`<a class="c ota-card" ${oLink(a)}>
      <div class="im" style="background-image:url('${E(a.poster)}')"></div>
      <div class="nm">${E(a.title)}</div>
      <div class="ota-meta">${E(a.status||'Status tidak tersedia')} · ★ ${E(a.score||'-')}</div>
      <div class="ota-meta">${(a.genreList||[]).map(g=>E(g.title)).join(' · ')}</div>
    </a>`).join('')}</div>
    <p class="mu" style="margin-top:18px">Pilih anime untuk melihat detail, atau membuka halaman sumber Otakudesu di tab baru.</p>`;
}
async function otakuPage(kind){
  const d=await otakuData(),completed=kind==='completed';
  const list=completed?d.completed.animeList:d.ongoing.animeList;
  const title=completed?'Anime Complete':'Anime Ongoing';
  app.innerHTML=`<div class="ota-head"><h2>${completed?'🏁':'📺'} ${title}</h2><span class="mu">${list.length} judul · Data katalog</span></div>
    <div class="g">${list.map(a=>otakuCard(a,completed)).join('')}</div>
    <p class="mu" style="margin-top:18px">Pilih anime untuk membuka halaman sumber Otakudesu di tab baru.</p>`;
}

async function otakuDetail(id){
  const d=await otakuData(),m=d.detail[decodeURIComponent(id||'')];
  if(!m){app.innerHTML='<p class="msg">Detail anime belum tersedia.<br><br><a class="btn" href="#/o/list">Ke Daftar Anime</a></p>';return}
  const rows=[['Judul Jepang',m.japanese],['Skor',m.score],['Tipe',m.type],['Status',m.status],['Episode',m.episodes],['Durasi',m.duration],['Tayang',m.aired],['Studio',m.studios],['Produser',m.producers]].filter(r=>r[1]);
  const syn=(m.synopsis&&m.synopsis.paragraphs||[]).map(p=>`<p>${E(p)}</p>`).join('');
  app.innerHTML=`<div class="d"><div class="cv" style="background-image:url('${E(m.poster)}')"></div><div class="in">
    <h2 style="margin-top:0">${E(m.title)}</h2>
    <div class="chips">${(m.genreList||[]).map(g=>`<a class="chip" href="#/o/genre/${E(g.genreId)}">${E(g.title)}</a>`).join('')}</div>
    <div class="dt">${rows.map(r=>`<div><span>${r[0]}</span><br>${E(r[1])}</div>`).join('')}</div>
    ${syn?`<div class="sy">${syn}</div>`:'<div class="mu">Sinopsis belum tersedia di data.</div>'}
    <div style="margin-top:12px"><a class="btn s" href="#/o/list">‹ Kembali</a></div></div></div>
    <h2>Daftar Episode <span class="mu">(${(m.episodeList||[]).length})</span></h2>
    <div class="eo">${(m.episodeList||[]).map(e=>`<a href="#/o/watch/${encodeURIComponent(e.episodeId||e.slug||String(e.otakudesuUrl||'').split('/').filter(Boolean).pop()||'')}"><b>Episode ${E(e.eps)}</b><small>${E(e.date)} · putar melalui Sanka</small></a>`).join('')}</div>
    ${(m.recommendedAnimeList||[]).length?`<h2>Rekomendasi</h2><div class="hs">${m.recommendedAnimeList.map(a=>`<a class="c ota-card" ${oLink(a)}><div class="im" style="background-image:url('${E(a.poster)}')"></div><div class="nm">${E(a.title)}</div></a>`).join('')}</div>`:''}`;
}
async function otakuGenres(){
  const d=await otakuData(),cnt={};
  (d.animeList||[]).forEach(a=>(a.genreList||[]).forEach(g=>cnt[g.genreId]=(cnt[g.genreId]||0)+1));
  app.innerHTML=`<div class="ota-head"><h2>🏷️ Genre</h2><span class="mu">${d.genres.length} genre</span></div>
    <div class="chips">${d.genres.map(g=>`<a class="chip" href="#/o/genre/${E(g.genreId)}">${E(g.title)}${cnt[g.genreId]?`<small>${cnt[g.genreId]}</small>`:''}</a>`).join('')}</div>
    <p class="mu">Angka menunjukkan jumlah anime di Daftar Anime yang punya genre tersebut.</p>`;
}
async function otakuGenre(id){
  const d=await otakuData(),gid=decodeURIComponent(id||''),g=d.genres.find(x=>x.genreId===gid);
  if(!g){app.innerHTML='<p class="msg">Genre tidak ditemukan.<br><br><a class="btn" href="#/o/genres">Semua genre</a></p>';return}
  const list=(d.animeList||[]).filter(a=>(a.genreList||[]).some(x=>x.genreId===gid));
  app.innerHTML=`<div class="ota-head"><h2>🏷️ ${E(g.title)}</h2><span class="mu">${list.length} judul</span></div>
    <div class="chips">${d.genres.map(x=>`<a class="chip${x.genreId===gid?' on':''}" href="#/o/genre/${E(x.genreId)}">${E(x.title)}</a>`).join('')}</div>
    ${list.length?`<div class="g">${list.map(a=>`<a class="c ota-card" ${oLink(a)}><div class="im" style="background-image:url('${E(a.poster)}')"></div><div class="nm">${E(a.title)}</div><div class="ota-meta">${E(a.status||'')} · ★ ${E(a.score||'-')}</div></a>`).join('')}</div>`:`<p class="msg">Belum ada anime bergenre ${E(g.title)} di Daftar Anime.<br><br><a class="btn" target="_blank" rel="noopener noreferrer" href="${E(g.otakudesuUrl)}">Lihat di Otakudesu ↗</a></p>`}`;
}

async function otakuWatch(slug){
  const id=decodeURIComponent(slug||'');
  app.innerHTML=`<div class="ota-head"><h2>▶ Pemutar Otakudesu</h2><span class="mu">Sumber: Sanka REST API</span></div><div class="pl" id="pl"><div class="msg">Menyiapkan episode…</div></div><p class="mu">Jika server gagal, kemungkinan endpoint upstream sedang berubah atau server video sumber sedang tidak tersedia.</p><div style="margin-top:14px"><a class="btn s" href="javascript:history.back()">‹ Kembali</a></div>`;
  await playSankaEpisode(id);
}

async function home(){
  const b='type:ANIME,isAdult:false';
  const d=await gql(`{a:Page(perPage:18){media(sort:TRENDING_DESC,${b}){${F}}}r:Page(perPage:18){media(sort:POPULARITY_DESC,status:RELEASING,${b}){${F}}}}`);
  app.innerHTML=`<h2>🔥 Lagi Tren</h2>${grid(d.a.media)}<h2>📺 Sedang Tayang</h2>${grid(d.r.media)}`;
}
async function find(q){
  const d=await gql(`query($q:String){Page(perPage:36){media(search:$q,type:ANIME,isAdult:false){${F}}}}`,{q});
  app.innerHTML=`<h2>Hasil: ${E(q)}</h2>`+(d.Page.media.length?grid(d.Page.media):'<p class="msg">Tidak ada hasil.</p>');
}
async function show(id){
  const m=(await gql(`query($i:Int){Media(id:$i,type:ANIME){${F}}}`,{i:+id})).Media;
  const n=m.episodes||(m.nextAiringEpisode?m.nextAiringEpisode.episode-1:12)||12;
  app.innerHTML=`<div class="d"><div class="cv" style="background-image:url('${E(m.coverImage.large)}')"></div><div class="in"><h1 style="font-size:24px">${E(T(m))}</h1>
  <div class="mu">${m.seasonYear||''} · ${E(m.status)} · ${E(m.genres.join(', '))}${m.averageScore?' · ★ '+(m.averageScore/10).toFixed(1):''}</div>
  <div class="sy">${E((m.description||'').replace(/<[^>]+>/g,''))}</div>${TR(m)}</div></div>
  <div class="pl" id="pl"><div class="msg">Pilih episode atau tekan Trailer.</div></div>
  <div class="bar"><b id="ep">Episode —</b><span style="flex:1"></span><button class="btn s" id="pv">‹</button><button class="btn s" id="nx">›</button><a class="btn s" id="dl" hidden target="_blank" rel="noopener" download>⬇</a></div>
  <div class="eps" id="eps">${Array.from({length:n},(_,i)=>`<button data-e="${i+1}">${i+1}</button>`).join('')}</div>`;
  let cur=0;
  const play=e=>{
    if(e<1||e>n)return;cur=e;
    document.querySelectorAll('#eps button').forEach(b=>b.classList.toggle('on',+b.dataset.e===e));
    $('#ep').textContent='Episode '+e;
    const c=cfg(),box=$('#pl'),dl=$('#dl');dl.hidden=true;if(hls){hls.destroy();hls=null}
    if(!c.t){
      box.innerHTML='<div class="msg">Mencari episode di Otakudesu melalui Sanka…</div>';
      sankaAutoEpisode([m.title.romaji,m.title.english],e)
        .then(slug=>{if(cur===e)playSankaEpisode(slug,T(m))})
        .catch(err=>{
          if(cur!==e)return;
          box.innerHTML=`<div class="msg">Streaming Sanka belum tersedia: ${E(err.message)}<br><br>Mencari sumber resmi…</div>`;
          fetch('/api/yt?ep='+e+'&t='+encodeURIComponent([m.title.english,m.title.romaji].filter(Boolean).join('|')))
            .then(r=>r.json()).then(y=>{if(cur!==e)return;if(y&&y.id){box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${E(y.id)}?autoplay=1" allowfullscreen allow="autoplay;fullscreen"></iframe>`}else box.innerHTML=`<div class="msg">Episode tidak ditemukan di Sanka atau YouTube resmi.<br><small>${E(err.message)}</small></div>`})
            .catch(()=>{if(cur===e)box.innerHTML=`<div class="msg">Gagal mengambil sumber video.<br><small>${E(err.message)}</small></div>`});
        });
      return;
    }
    const u=c.t.replace(/{id}/g,m.id).replace(/{ep}/g,e).replace(/{title}/g,encodeURIComponent(m.title.romaji));
    if(c.m==='i'){box.innerHTML=`<iframe src="${E(u)}" allowfullscreen allow="autoplay;fullscreen"></iframe>`;return}
    box.innerHTML='<video controls autoplay playsinline></video>';const v=box.firstChild;
    if(/\.m3u8/i.test(u)&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v)}else v.src=u;
    v.onerror=()=>box.innerHTML='<div class="msg">Video gagal dimuat. Cek alamat sumber.</div>';
    v.onended=()=>play(e+1);dl.href=u;dl.hidden=false;
  };
  const tr=$('#tr');if(tr)tr.onclick=()=>{$('#pl').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${E(m.trailer.id)}?autoplay=1" allowfullscreen allow="autoplay;fullscreen"></iframe>`;$('#pl').scrollIntoView({behavior:'smooth',block:'center'})};
  $('#eps').onclick=ev=>{const b=ev.target.closest('button');if(b)play(+b.dataset.e)};
  $('#pv').onclick=()=>play(cur-1);$('#nx').onclick=()=>play(cur+1);
}

const md=async p=>{const r=await fetch('/api/md?p='+encodeURIComponent(p));if(!r.ok)throw Error('MangaDex '+r.status);return r.json()};
const MT=a=>a.title.en||Object.values(a.title)[0]||'Tanpa judul';
const MC=m=>{const c=(m.relationships||[]).find(x=>x.type==='cover_art');return c&&c.attributes?`https://uploads.mangadex.org/covers/${m.id}/${c.attributes.fileName}.256.jpg`:''};
const mgrid=l=>`<div class="g">${l.map(m=>`<a class="c" href="#/m/${m.id}"><div class="im" style="background-image:url('${E(MC(m))}')"></div><div class="nm">${E(MT(m.attributes))}</div></a>`).join('')}</div>`;
const RT='&contentRating[]=safe&contentRating[]=suggestive';
const lang=()=>localStorage.getItem('ml')||'en';
const fc={};
async function feed(id){
  const L=lang();if(fc[id+L])return fc[id+L];
  const d=await md(`/manga/${id}/feed?limit=500&translatedLanguage[]=${L}&order[chapter]=asc&includeExternalUrl=0`+RT);
  const seen=new Set(),out=[];
  for(const c of d.data){const k=c.attributes.chapter||c.id;if(c.attributes.pages>0&&!seen.has(k)){seen.add(k);out.push(c)}}
  return fc[id+L]=out;
}
async function mhome(){
  const d=await md('/manga?limit=24&order[followedCount]=desc&includes[]=cover_art&hasAvailableChapters=true'+RT);
  app.innerHTML=`<h2>📚 Manga Populer</h2>${mgrid(d.data)}`;
}
async function mfind(q){
  const d=await md('/manga?limit=36&title='+encodeURIComponent(q)+'&includes[]=cover_art'+RT);
  app.innerHTML=`<h2>Manga: ${E(q)}</h2>`+(d.data.length?mgrid(d.data):'<p class="msg">Tidak ada hasil.</p>');
}
async function mshow(id){
  const [d,ch]=await Promise.all([md(`/manga/${id}?includes[]=cover_art`),feed(id)]);
  const m=d.data,a=m.attributes,ds=a.description.en||Object.values(a.description)[0]||'';
  const L=lang();
  app.innerHTML=`<div class="d"><div class="cv" style="background-image:url('${E(MC(m).replace('.256.jpg','.512.jpg'))}')"></div><div class="in"><h1 style="font-size:24px">${E(MT(a))}</h1>
  <div class="mu">${a.year||''} · ${E(a.status||'')} · ${E(a.tags.map(t=>t.attributes.name.en).slice(0,6).join(', '))}</div>
  <div class="sy">${E(ds)}</div>
  <select id="lg" class="f" style="background:var(--b2);border:1px solid var(--b3);border-radius:9px;padding:7px 10px"><option value="en"${L==='en'?' selected':''}>Bahasa Inggris</option><option value="id"${L==='id'?' selected':''}>Bahasa Indonesia</option></select></div></div>
  <h2>${ch.length} Chapter</h2>`+(ch.length?`<div class="cl">${ch.map(c=>`<a href="#/r/${id}/${c.id}">Ch. ${E(c.attributes.chapter||'?')}${c.attributes.title?' · '+E(c.attributes.title.slice(0,18)):''}</a>`).join('')}</div>`:'<p class="msg">Belum ada chapter yang bisa dibaca di bahasa ini. Coba bahasa lain.</p>');
  $('#lg').onchange=e=>{localStorage.setItem('ml',e.target.value);route()};
}
async function read(mid,cid){
  const [ch,d]=await Promise.all([feed(mid),md('/at-home/server/'+cid)]);
  const i=ch.findIndex(c=>c.id===cid),pv=ch[i-1],nx=ch[i+1];
  const nav=`<div class="bar" style="justify-content:center"><a class="btn s" href="${pv?`#/r/${mid}/${pv.id}`:'#/m/'+mid}">‹ ${pv?'Sebelumnya':'Daftar'}</a><a class="btn s" href="#/m/${mid}">☰</a><a class="btn" href="${nx?`#/r/${mid}/${nx.id}`:'#/m/'+mid}">${nx?'Berikutnya':'Selesai'} ›</a></div>`;
  const h=d.chapter.hash;
  app.innerHTML=`<div class="rd"><h2 style="text-align:center">Chapter ${E(i>=0?ch[i].attributes.chapter||'?':'')}</h2>${nav}${d.chapter.data.map(f=>`<img loading="lazy" src="${E(d.baseUrl)}/data/${E(h)}/${E(f)}" alt="">`).join('')}${nav}</div>`;
}
function set(){
  const c=cfg();
  app.innerHTML=`<h2>Sumber Video</h2><div class="f">
  <select id="m"><option value="v"${c.m!=='i'?' selected':''}>Video langsung (.mp4 / .m3u8)</option><option value="i"${c.m==='i'?' selected':''}>Embed (iframe)</option></select>
  <input id="t" value="${E(c.t||'')}" placeholder="https://servermu.com/{id}/{ep}.m3u8">
  <div class="mu">Pakai {id} (ID AniList), {ep} (nomor episode), {title}. Isi dengan sumber yang kamu punya hak aksesnya.</div>
  <button class="btn" id="s">Simpan</button><div class="mu" id="ok"></div></div>`;
  $('#s').onclick=()=>{localStorage.setItem('k',JSON.stringify({m:$('#m').value,t:$('#t').value.trim()}));$('#ok').textContent='Tersimpan ✓'};
}
async function route(){
  if(hls){hls.destroy();hls=null}
  const [,p,a,b]=location.hash.slice(1).split('/');scrollTo(0,0);
  try{p==='o'?(a==='list'?await otakuListPage():a==='d'?await otakuDetail(b):a==='watch'?await otakuWatch(b):a==='genres'?await otakuGenres():a==='genre'?await otakuGenre(b):a==='schedule'?await otakuSchedulePage():await otakuPage(a==='completed'?'completed':'ongoing')):p==='a'?await show(a):p==='m'?await(a?mshow(a):mhome()):p==='ms'?await mfind(decodeURIComponent(a||'')):p==='r'?await read(a,b):p==='s'?await find(decodeURIComponent(a||'')):p==='set'?set():await home()}
  catch(e){app.innerHTML=`<p class="msg">Gagal memuat: ${E(e.message)}<br><br><button class="btn" onclick="route()">Coba lagi</button></p>`}
}
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#si').value.trim();if(q)location.hash=(/^#\/(m|ms|r)(\/|$)/.test(location.hash)?'#/ms/':'#/s/')+encodeURIComponent(q)};
addEventListener('hashchange',route);route();
</script>
</body>
