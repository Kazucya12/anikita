<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anikita - Streaming & Scraper Anime</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #020617;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        select, input, button {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Video Player Section */
        .player-container {
            display: none;
            margin-bottom: 2rem;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .player-container iframe, .player-container video {
            width: 100%;
            height: 480px;
            border: none;
        }

        .player-title {
            padding: 1rem;
            background-color: var(--card-bg);
            font-size: 1.1rem;
        }

        /* Anime Cards Grid */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .anime-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .anime-card-body {
            padding: 0.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .anime-card-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }

        .anime-card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🚀 Anikita Stream</div>
        <div class="controls">
            <select id="providerSelect">
                <option value="otakudesu">Otakudesu</option>
                <option value="kuramanime">Kuramanime</option>
                <option value="kuronime">Kuronime</option>
                <option value="nanime">Nanime</option>
            </select>
            <input type="text" id="searchInput" placeholder="Cari anime...">
            <button id="searchBtn">Cari</button>
        </div>
    </header>

    <main>
        <!-- Section Player Video -->
        <div id="playerSection" class="player-container">
            <div id="videoWrapper"></div>
            <div id="playerTitle" class="player-title">Memutar Anime...</div>
        </div>

        <!-- Section List Anime -->
        <h2 id="sectionTitle" style="margin-bottom: 1.5rem;">Daftar Anime Terbaru</h2>
        <div id="animeContainer" class="anime-grid">
            <div class="loading">Memuat data anime...</div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
