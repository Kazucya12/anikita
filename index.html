<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kumori Lite</title>
<meta name="theme-color" content="#0e0f1a">
<style>
:root{--bg:#0e0f1a;--b2:#171928;--b3:#20233a;--tx:#eceefb;--mu:#8c91b3;--ac:#ff6b9d;--ac2:#7c5cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:9;display:flex;gap:12px;align-items:center;padding:10px 4vw;background:rgba(14,15,26,.92);border-bottom:1px solid var(--b3)}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#sf{margin-left:auto;flex:1;max-width:320px;display:flex}
#sf input{flex:1;min-width:0;background:var(--b2);border:1px solid var(--b3);border-radius:99px;padding:7px 14px;outline:0}
main{padding:10px 4vw 50px;max-width:1300px;margin:auto}
h2{font-size:18px;margin:22px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.c .im{aspect-ratio:2/3;border-radius:12px;background:var(--b2) center/cover}
.c .nm{margin-top:6px;font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-block;background:linear-gradient(90deg,var(--ac),var(--ac2));border:0;border-radius:99px;padding:8px 20px;font-weight:700;cursor:pointer}
.btn.s{background:var(--b3)}
.d{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}
.d .cv{width:170px;aspect-ratio:2/3;border-radius:12px;background:var(--b2) center/cover}
.d .in{flex:1;min-width:240px}
.mu{color:var(--mu);font-size:13px}
.sy{color:var(--mu);margin:8px 0;max-height:120px;overflow:auto}
.pl{margin:18px 0 10px;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.pl video,.pl iframe{width:100%;height:100%;border:0}
.msg{padding:20px;text-align:center;color:var(--mu)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.eps button{background:var(--b2);border:1px solid var(--b3);border-radius:9px;padding:8px 0;cursor:pointer}
.eps .on{background:linear-gradient(90deg,var(--ac),var(--ac2));border-color:transparent}
.f{max-width:520px;display:grid;gap:10px}
.f input,.f select{background:var(--b2);border:1px solid var(--b3);border-radius:9px;padding:9px 12px}
</style>
</head>
<body>
<header><a class="logo" href="#/">KUMORI</a><a class="mu" href="#/set">⚙ Sumber</a>
<form id="sf"><input id="si" placeholder="Cari anime…"></form></header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>{try{return JSON.parse(localStorage.getItem('k'))||{}}catch{return{}}};
const F='id title{romaji english}coverImage{large}averageScore episodes status genres seasonYear description nextAiringEpisode{episode} trailer{id site} externalLinks{url site type} streamingEpisodes{title url site}';
const gql=async(q,v)=>{const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:v})});const j=await r.json();if(j.errors)throw Error(j.errors[0].message);return j.data};
const T=m=>m.title.english||m.title.romaji;
const card=m=>`<a class="c" href="#/a/${m.id}"><div class="im" style="background-image:url('${E(m.coverImage.large)}')"></div><div class="nm">${E(T(m))}</div></a>`;
const grid=l=>`<div class="g">${l.map(card).join('')}</div>`;
let hls;
const OFF=m=>{const L=(m.externalLinks||[]).filter(x=>x.type==='STREAMING');return L.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">'+L.map(x=>`<a class="btn s" target="_blank" rel="noopener" href="${E(x.url)}">${E(x.site)} ↗</a>`).join('')+'</div>':'<div class="mu" style="margin-top:8px">Belum ada link resmi di AniList.</div>'};
const TR=m=>m.trailer&&m.trailer.site==='youtube'?`<button class="btn" id="tr">▶ Trailer</button> `:'';
async function home(){
  const b='type:ANIME,isAdult:false';
  const d=await gql(`{a:Page(perPage:18){media(sort:TRENDING_DESC,${b}){${F}}}r:Page(perPage:18){media(sort:POPULARITY_DESC,status:RELEASING,${b}){${F}}}}`);
  app.innerHTML=`<h2>🔥 Lagi Tren</h2>${grid(d.a.media)}<h2>📺 Sedang Tayang</h2>${grid(d.r.media)}`;
}
async function find(q){
  const d=await gql(`query($q:String){Page(perPage:36){media(search:$q,type:ANIME,isAdult:false){${F}}}}`,{q});
  app.innerHTML=`<h2>Hasil: ${E(q)}</h2>`+(d.Page.media.length?grid(d.Page.media):'<p class="msg">Tidak ada hasil.</p>');
}
async function show(id){
  const m=(await gql(`query($i:Int){Media(id:$i,type:ANIME){${F}}}`,{i:+id})).Media;
  const n=m.episodes||(m.nextAiringEpisode?m.nextAiringEpisode.episode-1:12)||12;
  app.innerHTML=`<div class="d"><div class="cv" style="background-image:url('${E(m.coverImage.large)}')"></div><div class="in"><h1 style="font-size:24px">${E(T(m))}</h1>
  <div class="mu">${m.seasonYear||''} · ${E(m.status)} · ${E(m.genres.join(', '))}${m.averageScore?' · ★ '+(m.averageScore/10).toFixed(1):''}</div>
  <div class="sy">${E((m.description||'').replace(/<[^>]+>/g,''))}</div>${TR(m)}</div></div>
  <div class="pl" id="pl"><div class="msg">Pilih episode atau tekan Trailer.</div></div>
  <div class="bar"><b id="ep">Episode —</b><span style="flex:1"></span><button class="btn s" id="pv">‹</button><button class="btn s" id="nx">›</button><a class="btn s" id="dl" hidden target="_blank" rel="noopener" download>⬇</a></div>
  <div class="eps" id="eps">${Array.from({length:n},(_,i)=>`<button data-e="${i+1}">${i+1}</button>`).join('')}</div>`;
  let cur=0;
  const play=e=>{
    if(e<1||e>n)return;cur=e;
    document.querySelectorAll('#eps button').forEach(b=>b.classList.toggle('on',+b.dataset.e===e));
    $('#ep').textContent='Episode '+e;
    const c=cfg(),box=$('#pl'),dl=$('#dl');dl.hidden=true;if(hls){hls.destroy();hls=null}
    if(!c.t){const se=(m.streamingEpisodes||[]).find(x=>new RegExp('(episode|ep)\\.? ?'+e+'\\b','i').test(x.title));box.innerHTML='<div class="msg">Sumber video pribadi belum diatur.<br>Tonton episode '+e+' lewat layanan resmi:'+(se?`<div style="margin-top:10px"><a class="btn" target="_blank" rel="noopener" href="${E(se.url)}">▶ Buka episode ${e} (${E(se.site)})</a></div>`:'')+OFF(m)+'<div style="margin-top:12px"><a class="mu" href="#/set">Atur sumber sendiri</a></div></div>';return}
    const u=c.t.replace(/{id}/g,m.id).replace(/{ep}/g,e).replace(/{title}/g,encodeURIComponent(m.title.romaji));
    if(c.m==='i'){box.innerHTML=`<iframe src="${E(u)}" allowfullscreen allow="autoplay;fullscreen"></iframe>`;return}
    box.innerHTML='<video controls autoplay playsinline></video>';const v=box.firstChild;
    if(/\.m3u8/i.test(u)&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v)}else v.src=u;
    v.onerror=()=>box.innerHTML='<div class="msg">Video gagal dimuat. Cek alamat sumber.</div>';
    v.onended=()=>play(e+1);dl.href=u;dl.hidden=false;
  };
  const tr=$('#tr');if(tr)tr.onclick=()=>{$('#pl').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${E(m.trailer.id)}?autoplay=1" allowfullscreen allow="autoplay;fullscreen"></iframe>`;$('#pl').scrollIntoView({behavior:'smooth',block:'center'})};
  $('#eps').onclick=ev=>{const b=ev.target.closest('button');if(b)play(+b.dataset.e)};
  $('#pv').onclick=()=>play(cur-1);$('#nx').onclick=()=>play(cur+1);
}
function set(){
  const c=cfg();
  app.innerHTML=`<h2>Sumber Video</h2><div class="f">
  <select id="m"><option value="v"${c.m!=='i'?' selected':''}>Video langsung (.mp4 / .m3u8)</option><option value="i"${c.m==='i'?' selected':''}>Embed (iframe)</option></select>
  <input id="t" value="${E(c.t||'')}" placeholder="https://servermu.com/{id}/{ep}.m3u8">
  <div class="mu">Pakai {id} (ID AniList), {ep} (nomor episode), {title}. Isi dengan sumber yang kamu punya hak aksesnya.</div>
  <button class="btn" id="s">Simpan</button><div class="mu" id="ok"></div></div>`;
  $('#s').onclick=()=>{localStorage.setItem('k',JSON.stringify({m:$('#m').value,t:$('#t').value.trim()}));$('#ok').textContent='Tersimpan ✓'};
}
async function route(){
  if(hls){hls.destroy();hls=null}
  const [,p,a]=location.hash.slice(1).split('/');scrollTo(0,0);
  try{p==='a'?await show(a):p==='s'?await find(decodeURIComponent(a||'')):p==='set'?set():await home()}
  catch(e){app.innerHTML=`<p class="msg">Gagal memuat: ${E(e.message)}<br><br><button class="btn" onclick="route()">Coba lagi</button></p>`}
}
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#si').value.trim();if(q)location.hash='#/s/'+encodeURIComponent(q)};
addEventListener('hashchange',route);route();
</script>
</body>
</html>
