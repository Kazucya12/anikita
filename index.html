<!DOCTYPE html>
<html lang="id">

<style>

body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}

.f{max-width:520px;display:grid;gap:10px}

.rd{max-width:820px;margin:auto}.rd img{width:100%;display:block;min-height:200px;background:var(--b2)}.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-top:10px}.cl a{background:var(--b2);border:1px solid var(--b3);border-radius:9px;padding:8px 10px;font-size:13px}.cl a:hover{border-color:var(--ac)}
.ota-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;color:var(--mu);font-size:11px}.ota-card{min-width:0}.ota-card .im{background-size:cover;background-position:center}.ota-card .nm{min-height:34px}.ota-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ota-head .mu{margin-left:auto}
header{flex-wrap:wrap;row-gap:6px}
main>*{animation:fin .35s ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.g>.c{animation:fin .4s ease both}.g>.c:nth-child(2){animation-delay:.04s}.g>.c:nth-child(3){animation-delay:.08s}.g>.c:nth-child(4){animation-delay:.12s}.g>.c:nth-child(n+5){animation-delay:.16s}
.c .im{transition:transform .25s,box-shadow .25s}.c:hover .im{transform:translateY(-4px);box-shadow:0 10px 24px rgba(124,92,255,.35)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

.chip small{color:var(--mu);margin-left:4px}.chip:hover small,.chip.on small{color:#fff}
.dt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;margin:10px 0;font-size:13px}.dt span{color:var(--mu)}
.eo{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.eo a{background:var(--b2);border:1px solid var(--b3);border-radius:10px;padding:10px 12px;font-size:13px;transition:.2s;display:flex;flex-direction:column;gap:2px}.eo a:hover{border-color:var(--ac);transform:translateY(-2px)}.eo b{font-size:14px}.eo small{color:var(--mu)}
.hs{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}.hs .c{flex:0 0 130px}
@media(max-width:560px){header{gap:8px}.d .cv{width:120px}.eo{grid-template-columns:1fr 1fr}}

.c .im img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.cv img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}.c .im img{position:absolute;inset:0}.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px 0 4px}.tabs::-webkit-scrollbar{display:none}.tabs a{flex:0 0 auto;white-space:nowrap;background:var(--b2);border:1px solid var(--b3);border-radius:99px;padding:8px 16px;font-weight:600;color:var(--mu)}.tabs a.on{background:linear-gradient(90deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}.pg{display:flex;gap:10px;justify-content:center;margin-top:18px}

/* ===== navigasi atas, tanpa geser ===== */
#tb{max-width:1300px;margin:auto;padding:10px 4vw 0}
#bn{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}

#sanka-servers{flex-wrap:wrap;overflow:visible}#sanka-servers .chip{white-space:normal}
.dlr{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.dlr>b{flex:0 0 58px;padding-top:8px;font-size:14px}.dlr .chips{margin:0;flex:1}.dlr .chip{min-height:36px;display:inline-flex;align-items:center}
.g>.cw{animation:fin .4s ease both}.cw .rl{display:block;margin-top:-6px;padding:0 2px 6px;font-size:12px;color:var(--ac);font-weight:600}

<body>
<header><div class="hr"><a class="logo" href="#/">KUMORI</a><div class="seg"><a id="ta" href="#/">Anime</a><a id="tm" href="#/m">Manga</a></div><a class="ib" href="#/fav" aria-label="Favorit">❤</a><a class="ib" href="#/set" aria-label="Pengaturan">⚙</a></div>
</header>
<div id="tb"><form id="sf"><input id="si" placeholder="Cari anime…"></form><nav id="bn" aria-label="Menu utama"></nav></div>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>{try{return JSON.parse(localStorage.getItem('k'))||{}}catch{return{}}};
const F='id title{romaji english} synonyms coverImage{large}averageScore episodes status genres seasonYear description nextAiringEpisode{episode airingAt} trailer{id site} externalLinks{url site type} streamingEpisodes{title url site}';
const gql=async(q,v)=>{
  const body=JSON.stringify({query:q,variables:v});
  const go=async url=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body});const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('Respons AniList bukan JSON ('+r.status+')')}if(j.errors)throw Error(j.errors[0].message);if(!r.ok)throw Error('AniList HTTP '+r.status);return j.data};
  try{return await go('/api/anilist')}catch(e1){
    try{return await go('https://graphql.anilist.co')}
    catch(e2){throw Error('Tidak bisa terhubung ke AniList. Cek koneksi/VPN/adblock, atau pastikan folder api/ ikut ter-deploy. ('+(e2.message||e1.message)+')')}
  }
};
const T=m=>m.title.english||m.title.romaji;
const card=m=>`<a class="c" href="#/a/${m.id}"><div class="im" style="background-image:url('${E(m.coverImage.large)}')">${m.averageScore?`<span class="bd">★ ${(m.averageScore/10).toFixed(1)}</span>`:''}${m.nextAiringEpisode?`<span class="bd b2">Eps ${m.nextAiringEpisode.episode-1}</span>`:''}</div><div class="nm">${E(T(m))}</div>${m.nextAiringEpisode&&m.nextAiringEpisode.airingAt?`<div class="ota-meta"><span>${E(shortWIB(m.nextAiringEpisode.airingAt))}</span></div>`:''}</a>`;
const grid=l=>`<div class="g">${l.map(card).join('')}</div>`;
let hls;
const OFF=m=>{const L=(m.externalLinks||[]).filter(x=>x.type==='STREAMING');return L.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">'+L.map(x=>`<a class="btn s" target="_blank" rel="noopener" href="${E(x.url)}">${E(x.site)} ↗</a>`).join('')+'</div>':'<div class="mu" style="margin-top:8px">Belum ada link resmi di AniList.</div>'};
const TR=m=>m.trailer&&m.trailer.site==='youtube'?`<button class="btn" id="tr">▶ Trailer</button> `:'';

 
const hist=()=>{try{return JSON.parse(localStorage.getItem('kw'))||{}}catch{return{}}};
const SY=t=>`<div class="sec"><h3 class="sh">Sinopsis</h3><div class="sy c3">${t||'<span class="mu">Sinopsis belum tersedia.</span>'}</div><button class="lk">Baca selengkapnya</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('.lk');if(b){const o=b.previousElementSibling.classList.toggle('c3');b.textContent=o?'Baca selengkapnya':'Tutup'}});
const SK=`<div class="g">${'<div class="c"><div class="im sk"></div><div class="nm sk" style="height:14px;margin-top:8px"></div></div>'.repeat(12)}</div>`;
const NAV_A=[['#/','🏠','Beranda',h=>h==='#/'||/^#\/(a|s)(\/|$)/.test(h)],['#/o/ongoing','📺','Ongoing',h=>/^#\/o\/(ongoing|completed)/.test(h)],['#/o/schedule','📅','Jadwal',h=>/^#\/o\/schedule/.test(h)],['#/o/list','📚','Daftar',h=>/^#\/o\/(list|d|e)(\/|$)/.test(h)],['#/o/genres','🏷️','Genre',h=>/^#\/o\/(genres|g)(\/|$)/.test(h)]];
const NAV_M=[['#/m','🏠','Beranda',h=>h==='#/m'||/^#\/ms\//.test(h)||(/^#\/m\//.test(h)&&!/^#\/m\/t\//.test(h))],['#/m/t/pop','🔥','Populer',h=>/^#\/m\/t\/pop/.test(h)],['#/m/t/ongoing','🟢','Ongoing',h=>/^#\/m\/t\/ongoing/.test(h)],['#/m/t/done','✅','Tamat',h=>/^#\/m\/t\/done/.test(h)]];
const setNav=()=>{const h=location.hash||'#/';const mg=/^#\/(m|ms|r)(\/|$)/.test(h);$('#ta').classList.toggle('on',!mg);$('#tm').classList.toggle('on',mg);$('#si').placeholder=mg?'Cari manga…':'Cari anime…';document.body.classList.toggle('rd-mode',/^#\/r\//.test(h));const NV=mg?NAV_M:NAV_A;$('#bn').style.gridTemplateColumns='repeat('+NV.length+',1fr)';$('#bn').innerHTML=NV.map(([href,ic,nm,t])=>`<a href="${href}"${t(h)?' class="on" aria-current="page"':''}><span>${nm}</span></a>`).join('')};
function contWatch(){const l=Object.entries(hist()).sort((x,y)=>y[1].ts-x[1].ts).slice(0,6);return l.length?`<h2>▶ Lanjutkan Menonton</h2><div class="hs">${l.map(([id,x])=>`<a class="c" href="#/a/${id}"><div class="im" style="background-image:url('${E(x.c)}')"><span class="bd b2">Eps ${x.e}</span></div><div class="nm">${E(x.t)}</div></a>`).join('')}</div>`:''}
// Sanka proxy: API upstream dipanggil dari Vercel Function agar tidak terkena CORS.
async function sankaFetch(path){
  const r=await fetch('/api/sanka?p='+encodeURIComponent(path));
  const raw=await r.text();
  let j; try{j=JSON.parse(raw)}catch{throw Error('Respons Sanka bukan JSON ('+r.status+').')}
  if(!r.ok) throw Error((j&&j.message)||('Sanka API HTTP '+r.status));
  if(j&&j.status==='error') throw Error(j.message||'Sanka API gagal');
  if(j&&!j.data&&j.message) throw Error(j.message);
  return j&&j.data!==undefined?j.data:j;
}
const SRC={
  sh:{name:'Samehadaku',search:q=>['/samehadaku/search?q='+encodeURIComponent(q),'/samehadaku/search/'+encodeURIComponent(q)],anime:'/samehadaku/anime/',ep:'/samehadaku/episode/',sv:'/samehadaku/server/',site:'https://v2.samehadaku.how'},
  ota:{name:'Otakudesu',ep:'/anime/episode/',sv:'/anime/server/',site:'https://otakudesu.blog'}
};
function sankaQueries(titles){
  const out=[];
  const add=x=>{x=String(x||'').replace(/\s+/g,' ').trim();if(x&&!out.includes(x))out.push(x)};
  (titles||[]).filter(Boolean).forEach(t=>{
    const clean=String(t).replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
    const base=clean.replace(/\b(\d+(st|nd|rd|th)\s+season|season\s*\d+|part\s*\d+|cour\s*\d+)\b/ig,' ').replace(/\s+/g,' ').trim();
    add(clean);
    add(base);
    add(base.split(' ').slice(0,4).join(' '));
    add(base.split(' ').slice(0,3).join(' '));
    add(base.split(' ').slice(0,2).join(' '));
    add(base.split(' ')[0]);
  });
  return out;
}
function sankaNorm(t){return String(t||'').toLowerCase().replace(/on-going|subtitle indonesia|sub indo/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function sankaSeason(t){const m=String(t||'').toLowerCase().match(/(\d+)(?:st|nd|rd|th)\s+season|season\s*(\d+)|\bs(\d+)\b/);return m?+(m[1]||m[2]||m[3]):1}
function sankaScore(cand,titles){
  const ct=sankaNorm(cand),cs=new Set(ct.split(' '));let best=0;
  titles.filter(Boolean).forEach(t=>{
    const tt=sankaNorm(t),ts=new Set(tt.split(' '));
    let inter=0;ts.forEach(w=>{if(cs.has(w))inter++});
    let sc=inter/Math.max(1,new Set([...ts,...cs]).size);
    if(ct===tt)sc+=1;
    if(sankaSeason(cand)===sankaSeason(t))sc+=0.15;else sc-=0.15;
    if(sc>best)best=sc;
  });
  return best;
}
async function sankaAutoEpisode(titles,ep){
  titles=[].concat(titles||[]).filter(Boolean);
  let best=null,lastErr=null;
  for(const q of sankaQueries(titles)){
    let data=null;
    for(const path of SRC.sh.search(q)){
      try{data=await sankaFetch(path);break}catch(e){lastErr=e}
    }
    if(!data)continue;
    const results=walkObjects(data).filter(o=>o.title&&o.animeId);
    if(!results.length)continue;
    results.forEach(o=>{o._sc=sankaScore(o.title,titles)-(/batch|episode\s*\d/i.test(o.title)?0.3:0)});
    results.sort((x,y)=>y._sc-x._sc);
    if(!best||results[0]._sc>best._sc)best=results[0];
    if(best._sc>=0.5)break;
  }
  if(!best||best._sc<0.25)throw Error((lastErr&&lastErr.message)||'Anime tidak ditemukan.');
  window.shUrl=best.samehadakuUrl||'';
  const detail=await sankaFetch(SRC.sh.anime+encodeURIComponent(best.animeId));
  const eps=walkObjects(detail).filter(o=>o.episodeId);
  const re=new RegExp('(episode|ep)\\.?\\s*0*'+ep+'(?!\\d)','i');
  const hit=eps.find(o=>String(o.eps)===String(ep))
    ||eps.find(o=>re.test(String(o.title||'')))
    ||eps.find(o=>new RegExp('-episode-0*'+ep+'$','i').test(String(o.episodeId)));
  if(hit)return String(hit.episodeId);
  // detail tidak memuat daftar episode: tebak dari pola ID Samehadaku
  return best.animeId+'-episode-'+ep;
}
async function otaAutoEpisode(titles,ep){
  titles=[].concat(titles||[]).filter(Boolean);let best=null,lastErr=null;
  for(const q of sankaQueries(titles).slice(0,6)){
    let data;try{data=await sankaFetch('/anime/search/'+encodeURIComponent(q))}catch(e){lastErr=e;continue}
    const rs=walkObjects(data).filter(o=>o.title&&o.animeId);if(!rs.length)continue;
    rs.forEach(o=>{o._sc=sankaScore(o.title,titles)-(/batch/i.test(o.title)?0.3:0)});rs.sort((x,y)=>y._sc-x._sc);
    if(!best||rs[0]._sc>best._sc)best=rs[0];if(best._sc>=0.5)break;
  }
  if(!best||best._sc<0.25)throw Error((lastErr&&lastErr.message)||'Anime tidak ditemukan.');
  const detail=await sankaFetch('/anime/anime/'+encodeURIComponent(best.animeId));
  const eps=walkObjects(detail).filter(o=>o.episodeId);
  const re=new RegExp('(episode|ep)\\.?\\s*0*'+ep+'(?!\\d)','i');
  const hit=eps.find(o=>String(o.eps)===String(ep))||eps.find(o=>re.test(String(o.title||'')));
  if(!hit)throw Error('Episode '+ep+' belum tersedia.');
  return String(hit.episodeId);
}

function walkObjects(value,out=[]){
  if(!value||typeof value!=='object')return out;
  if(Array.isArray(value)){value.forEach(x=>walkObjects(x,out));return out;}
  out.push(value);Object.values(value).forEach(x=>{if(x&&typeof x==='object')walkObjects(x,out)});return out;
}
function findVideo(value){
  if(!value||typeof value!=='object')return '';
  for(const k of ['defaultStreamingUrl','streamingUrl','streamUrl','stream_url','embed_url','embedUrl','video_url','videoUrl']){
    const v=value[k];if(typeof v==='string'&&/^https?:\/\//i.test(v))return v;
  }
  const rest=Array.isArray(value)?value:Object.fromEntries(Object.entries(value).filter(([k])=>k!=='downloadUrl'));
  const objs=walkObjects(rest);
  for(const o of objs){
    for(const k of ['url','link','file','src','embed','iframe']){
      const v=o[k];if(typeof v==='string'&&/^https?:\/\//i.test(v)&&!/otakudesu\.|desustream\.com\/\?id=/i.test(v))return v;
    }
  }
  return '';
}
function episodeServerButtons(data){
  const items=[];
  const qs=(data&&data.server&&data.server.qualities)||[];
  qs.forEach(q=>(q.serverList||[]).forEach(sv=>{
    if(sv&&sv.serverId){const nm=String(sv.title||'').trim(),ql=String(q.title||'').trim();items.push({id:String(sv.serverId),name:ql&&!nm.toLowerCase().includes(ql.toLowerCase())?nm+' '+ql:nm});}
  }));
  if(!items.length)walkObjects(data).forEach(o=>{if(o&&o.serverId)items.push({id:String(o.serverId),name:String(o.title||o.name||o.serverId)})});
  return [...new Map(items.map(x=>[x.id,x])).values()];
}

/* ===== DOWNLOAD (360p / 480p / 720p / 1080p) ===== */
function parseDownloads(data){
  const out=[],seen=new Set();
  const qOf=t=>{const m=String(t||'').match(/(\d{3,4})\s*p\b|^\s*(\d{3,4})\s*$|[_\s-](\d{3,4})p/i);return m?(m[1]||m[2]||m[3])+'p':''};
  const fOf=t=>{const m=String(t||'').match(/\b(mkv|mp4|x265|webm|avi)\b/i);return m?m[1].toUpperCase():''};
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return 'Unduh'}};
  const push=(c,name,url)=>{
    if(!/^https?:\/\//i.test(url)||seen.has(c.q+'|'+url))return;
    seen.add(c.q+'|'+url);
    out.push({q:c.q||'Lainnya',f:c.f||'',n:String(name||'').trim()||host(url),u:url});
  };
  const rec=(v,c,key)=>{
    if(Array.isArray(v)){v.forEach(x=>rec(x,c));return}
    if(typeof v==='string'){push(c,key,v);return}
    if(!v||typeof v!=='object')return;
    const t=v.title||v.name||v.quality||v.resolution||v.format||'';
    const n={...c};
    const q=qOf(v.quality||v.resolution||t),f=fOf(v.format||t);
    if(q)n.q=q;if(f&&!q)n.f=f;
    if(typeof v.url==='string'||typeof v.link==='string'){push(n,(q?'':t)||v.host||v.server||'',v.url||v.link)}
    for(const [k,x] of Object.entries(v)){
      if(/^(title|name|quality|resolution|format|url|link|host|server)$/i.test(k))continue;
      if(x&&typeof x==='object'||typeof x==='string'){
        const k2={...n};const kq=qOf(k),kf=fOf(k);
        if(kq)k2.q=kq;else if(kf)k2.f=kf;
        rec(x,k2,k);
      }
    }
  };
  if(data&&typeof data==='object')Object.entries(data).forEach(([k,v])=>{if(/^(download|downloads|downloadUrl|download_url)$/i.test(k)&&v)rec(v,{q:qOf(k),f:''},k)});
  return out;
}
function showDownloads(box,data){
  const old=document.getElementById('dl-box');if(old)old.remove();
  const l=parseDownloads(data);if(!l.length||!box||!box.parentNode)return;
  const by={};l.forEach(x=>(by[x.q]=by[x.q]||[]).push(x));
  const num=q=>parseInt(q)||99999;
  const qs=Object.keys(by).sort((a,b)=>num(a)-num(b));
  const el=document.createElement('div');el.id='dl-box';el.className='sec';
  el.innerHTML='<h3 class="sh">⬇ Download</h3>'+qs.map(q=>`<div class="dlr"><b>${E(q)}</b><div class="chips">${by[q].map(x=>`<a class="chip" target="_blank" rel="noopener noreferrer" href="${E(x.u)}">${E((x.f?x.f+' • ':'')+x.n)}</a>`).join('')}</div></div>`).join('');
  box.parentNode.insertBefore(el,box.nextSibling);
}

const TZ='Asia/Jakarta';
const fmt=(ts,o)=>new Intl.DateTimeFormat('id-ID',{timeZone:TZ,...o}).format(new Date(ts*1000));
const jam=ts=>fmt(ts,{hour:'2-digit',minute:'2-digit',hour12:false}).replace(':','.');
const fullWIB=ts=>fmt(ts,{weekday:'long',day:'numeric',month:'short',year:'numeric'})+' • '+jam(ts)+' WIB';
const shortWIB=ts=>fmt(ts,{weekday:'short'})+' '+jam(ts)+' WIB';
const rel=ts=>{let d=ts-Math.floor(Date.now()/1000);const f=d<0;d=Math.abs(d);const D=Math.floor(d/86400),H=Math.floor(d%86400/3600),M=Math.floor(d%3600/60);const t=D?D+' hari '+H+' jam':H?H+' jam '+M+' menit':M+' menit';return f?t+' lalu':t+' lagi'};

const airCache={};
const airTitle=t=>String(t||'').replace(/\b(subtitle indonesia|sub indo)\b/gi,'').replace(/\s+/g,' ').trim();
async function airLookup(titles){
  const need=[...new Set(titles)].filter(t=>!(t in airCache));
  for(let i=0;i<need.length;i+=10){
    const ch=need.slice(i,i+10);
    const vars=ch.map((_,j)=>'$t'+j+':String').join(',');
    const q=`query(${vars}){${ch.map((_,j)=>`a${j}:Page(perPage:3){media(search:$t${j},type:ANIME,status:RELEASING,isAdult:false){id title{romaji english}synonyms nextAiringEpisode{airingAt episode}}}`).join('')}}`;
    const v={};ch.forEach((t,j)=>v['t'+j]=airTitle(t));
    try{
      const d=await gql(q,v);
      ch.forEach((t,j)=>{
        const l=(d['a'+j]&&d['a'+j].media)||[];let best=null,bs=0;
        l.forEach(m=>{const sc=sankaScore(airTitle(t),[m.title.romaji,m.title.english,...(m.synonyms||[])].filter(Boolean));if(sc>bs){bs=sc;best=m}});
        airCache[t]=best&&bs>=0.5&&best.nextAiringEpisode?best.nextAiringEpisode:null;
      });
    }catch(e){console.warn('jam tayang gagal',e)}
  }
}

async function mdFetch(path){
  const r=await fetch('/api/md?p='+enc(path));
  let j;try{j=await r.json()}catch{throw Error('Respons MangaDex bukan JSON ('+r.status+')')}
  if(!r.ok){throw Error(r.status===429?'MangaDex membatasi permintaan (429). Coba lagi sebentar lagi.':(j&&j.errors&&j.errors[0]&&j.errors[0].detail)||(j&&j.error)||('MangaDex HTTP '+r.status))}
  return j;
}
const mLang=()=>cfg().ml||'id';
const mT=m=>{const t=m.attributes.title||{};return t.en||t[Object.keys(t)[0]]||'Tanpa judul'};
const mCover=(m,s=256)=>{const c=(m.relationships||[]).find(r=>r.type==='cover_art');return c&&c.attributes&&c.attributes.fileName?`https://uploads.mangadex.org/covers/${m.id}/${c.attributes.fileName}.${s}.jpg`:''};
const px=u=>cfg().ip&&/mangadex\.(org|network)/i.test(u)?'/api/md?u='+encodeURIComponent(u):u;
function imgFb(el){
  el.dataset.fb=(+el.dataset.fb||0)+1;
  const m=el.src.match(/\/api\/md\?u=([^&]+)/);
  const orig=m?decodeURIComponent(m[1]):el.src;
  if(!m){el.src='/api/md?u='+encodeURIComponent(orig);return}
  const full=orig.replace(/(\.(?:jpe?g|png|webp))\.\d+\.jpg$/i,'$1');
  if(full!==orig&&!el.dataset.full){el.dataset.full=1;el.src='/api/md?u='+encodeURIComponent(full);return}
  el.style.visibility='hidden';
}

let mH={f:'',off:0,list:[],seen:new Set(),more:true};
async function mdLatestBatch(){
  const L=mLang();
  const j=await mdFetch(`/chapter?limit=100&offset=${mH.off}&translatedLanguage[]=${L}&order[readableAt]=desc&includeFutureUpdates=0&includeEmptyPages=0&includeExternalUrl=0&contentRating[]=safe&contentRating[]=suggestive&includes[]=manga${mH.f?'&originalLanguage[]='+mH.f:''}`);
  mH.off+=100;mH.more=mH.off<(j.total||0)&&j.data.length>0;
  const ents=[];
  for(const c of j.data){
    const r=(c.relationships||[]).find(x=>x.type==='manga');
    if(!r||mH.seen.has(r.id))continue;mH.seen.add(r.id);
    const a=c.attributes;
    ents.push({mid:r.id,ch:c.id,num:a.chapter,at:Math.floor(new Date(a.readableAt||a.publishAt||a.createdAt).getTime()/1000)||0,lang:r.attributes&&r.attributes.originalLanguage});
  }
  const use=ents.slice(0,60);
  if(!use.length)return;
  const mj=await mdFetch('/manga?limit='+use.length+'&'+use.map(e=>'ids[]='+e.mid).join('&')+'&includes[]=cover_art'+MR);
  const mm={};mj.data.forEach(m=>mm[m.id]=m);
  use.forEach(e=>{if(mm[e.mid])mH.list.push({...e,m:mm[e.mid]})});
}

  const j=await mdFetch(mQ(k,pg));
  const tot=Math.ceil((j.total||0)/24);
  app.innerHTML=mTabs(k)+`<div class="ota-head"><h2>${MK[k].h}</h2><span class="mu">Hal. ${pg}${tot?' / '+tot:''} • ${mLang()==='id'?'Indonesia':'English'}</span></div>${mGrid(j.data)}<div class="pg">${pg>1?`<a class="btn s" href="#/m/t/${k}/${pg-1}">← Sebelumnya</a>`:''}${j.data.length===24?`<a class="btn" href="#/m/t/${k}/${pg+1}">Berikutnya →</a>`:''}</div>`;
}
async function vMangaSearch(q){
  app.innerHTML=SK;
  const j=await mdFetch(`/manga?limit=36&title=${enc(q)}&includes[]=cover_art&order[relevance]=desc${MR}`);
  app.innerHTML=`<h2>Hasil manga: ${E(q)}</h2>`+(j.data.length?mGrid(j.data):'<div class="msg">Tidak ada hasil.</div>');
}
const chCache={};
async function getChapters(mid,lang){
  const key=mid+'|'+lang;if(chCache[key])return chCache[key];
  let all=[],off=0,total=1;
  while(off<total&&off<2000){
    const j=await mdFetch(`/manga/${mid}/feed?limit=500&offset=${off}&translatedLanguage[]=${lang}&order[chapter]=asc&includeExternalUrl=0${MR}`);
    all=all.concat(j.data);total=j.total||0;off+=500;if(!j.data.length)break;
  }
  const seen=new Set(),out=[];
  all.forEach(c=>{const a=c.attributes;if(a.externalUrl||a.pages===0)return;const k=a.chapter==null?c.id:a.chapter;if(seen.has(k))return;seen.add(k);out.push({id:c.id,num:a.chapter,title:a.title,vol:a.volume,at:Math.floor(new Date(a.publishAt||a.readableAt||a.createdAt).getTime()/1000)||0})});
  return chCache[key]=out;
}
const chTime=c=>c.at?`<small style="display:block;opacity:.7">${E(fmt(c.at,{day:'numeric',month:'short',year:'numeric'}))} • ${E(jam(c.at))} WIB</small>`:'';
const mEst=l=>{const r=l.filter(c=>c.at).slice(-10);if(r.length<4)return '';const cnt={};r.forEach(c=>{const k=fmt(c.at,{weekday:'long'});cnt[k]=(cnt[k]||0)+1});const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(top[1]<3)return '';const hs=r.filter(c=>fmt(c.at,{weekday:'long'})===top[0]).map(c=>+fmt(c.at,{hour:'2-digit',hour12:false}));const h=Math.round(hs.reduce((a,b)=>a+b,0)/hs.length);return `Perkiraan jadwal: biasanya update hari <b>${E(top[0])}</b> sekitar jam <b>${String(h).padStart(2,'0')}.00 WIB</b> (estimasi dari chapter terakhir)`};
const chLabel=c=>(c.num!=null?'Ch. '+c.num:'Oneshot')+(c.title?' – '+c.title:'');
async function vManga(id){
  app.innerHTML=SK;const L=mLang();
  const [mj,chs]=await Promise.all([mdFetch(`/manga/${id}?includes[]=cover_art&includes[]=author`),getChapters(id,L)]);
  const m=mj.data,a=m.attributes;
  const desc=clean((a.description&&(a.description[L]||a.description.en||a.description[Object.keys(a.description)[0]]))||'').replace(/\n/g,'<br>');
  const tags=(a.tags||[]).map(t=>t.attributes.name.en).filter(Boolean);
  const au=(m.relationships||[]).filter(r=>r.type==='author').map(r=>r.attributes&&r.attributes.name).filter(Boolean).join(', ');
  const rev=chs.slice().reverse();
  window._mm={id,t:mT(m),c:mCover(m,256)};
  const pr=prog()[id],prc=pr&&chs.find(c=>c.id===pr.ch),rs=new Set((pr&&pr.r)||[]);
  app.innerHTML=`<div class="d"><div class="cv">${mImg(mCover(m,512),mT(m))}</div><div class="in"><h2 style="margin-top:0">${E(mT(m))}</h2>
  <div class="mu">${[au,a.year,a.status,chs.length?chs.length+' chapter':''].filter(Boolean).map(E).join(' • ')}</div>
  ${chs.length?`<div class="mu" style="margin:6px 0">🕒 Chapter terakhir rilis: <b>${E(fullWIB(chs[chs.length-1].at))}</b>${mEst(chs)?'<br>'+mEst(chs):''}</div>`:''}
  <div class="chips">${tags.slice(0,8).map(t=>`<span class="chip">${E(t)}</span>`).join('')}</div>
  ${chs.length?`${prc?`<a class="btn" href="#/r/${E(prc.id)}">▶ Lanjut ${E(chShort(prc))}</a> `:''}<a class="btn${prc?' s':''}" href="#/r/${E(chs[0].id)}">${prc?'Dari awal':'▶ Baca '+E(chShort(chs[0]))}</a> <a class="btn s" href="#/r/${E(chs[chs.length-1].id)}">Terbaru</a>`:''}${favBtn('m:'+id)}
  <div class="bar" style="margin-top:10px"><span class="mu">Bahasa:</span><button class="chip${L==='id'?' on':''}" data-l="id">Indonesia</button><button class="chip${L==='en'?' on':''}" data-l="en">English</button></div></div></div>
  ${SY(desc)}<h2>Chapter</h2>${chs.length?`<div class="cl">${rev.map(c=>`<a href="#/r/${E(c.id)}"${rs.has(c.id)?' class="rdn"':''}>${rs.has(c.id)?'✓ ':''}${E(chLabel(c))}${chTime(c)}</a>`).join('')}</div>`:`<div class="msg">Belum ada chapter dalam bahasa ${L==='id'?'Indonesia':'English'}.</div>`}`;
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{saveCfg({ml:b.dataset.l});route()});
  bindFav('m:'+id,{t:mT(m),c:mCover(m,256),h:'#/m/'+id});
}
async function vReader(id){
  app.innerHTML=SK;
  const ds=cfg().ds;
  const [ah,meta]=await Promise.all([mdFetch('/at-home/server/'+enc(id)),mdFetch('/chapter/'+enc(id)).catch(()=>null)]);
  const files=(ds?ah.chapter.dataSaver:ah.chapter.data)||ah.chapter.data||[];
  const dir=ds&&ah.chapter.dataSaver?'data-saver':'data';
  let mid=null,lang=mLang(),list=[];
  if(meta&&meta.data){const rel=(meta.data.relationships||[]).find(r=>r.type==='manga');mid=rel&&rel.id;lang=meta.data.attributes.translatedLanguage||lang}
  if(mid){try{list=await getChapters(mid,lang)}catch{}}
  const i=list.findIndex(c=>c.id===id),prev=i>0?list[i-1]:null,next=i>=0&&i<list.length-1?list[i+1]:null;
  const cp=mid?prog()[mid]:null,resume=cp&&cp.ch===id&&cp.p>0?cp.p:0;
  if(mid){
    const old=cp||{};
    saveProg(mid,{ch:id,l:i>=0?chShort(list[i]):'',p:resume,r:[...new Set([...(old.r||[]),id])].slice(-400)});
    const mm=window._mm&&window._mm.id===mid?window._mm:null;
    if(mm)saveProg(mid,{t:mm.t,c:mm.c});
    else if(!old.t)mdFetch('/manga/'+enc(mid)+'?includes[]=cover_art').then(j=>saveProg(mid,{t:mT(j.data),c:mCover(j.data,256)})).catch(()=>{});
  }
  const nav=`<div class="bar" style="justify-content:space-between;max-width:820px;margin:10px auto">${prev?`<a class="btn s" href="#/r/${E(prev.id)}">← Sebelumnya</a>`:'<span></span>'}${mid?`<a class="btn s" href="#/m/${E(mid)}">☰ Chapter</a>`:''}${next?`<a class="btn" href="#/r/${E(next.id)}">Berikutnya →</a>`:'<span></span>'}</div>`;
  app.innerHTML=`<h2 style="text-align:center">${i>=0?E(chLabel(list[i])):'Baca Chapter'}</h2>${resume?`<div class="mu rs">↩ Dilanjutkan dari halaman ${resume+1}. <a href="#/r/${E(id)}" id="rtop">Ke atas</a></div>`:''}${nav}<div class="rd">${files.map((f,n)=>`<img loading="${resume&&n<=resume+1?'eager':'lazy'}" referrerpolicy="no-referrer" src="${E(px(ah.baseUrl+'/'+dir+'/'+ah.chapter.hash+'/'+f))}" alt="Halaman" onerror="imgFb(this)">`).join('')||'<div class="msg">Halaman tidak ditemukan.</div>'}</div>${nav}`;
  const kd=e=>{if(e.key==='ArrowRight'&&next)location.hash='#/r/'+next.id;if(e.key==='ArrowLeft'&&prev)location.hash='#/r/'+prev.id};
  window.addEventListener('keydown',kd);window._kd=kd;
  let tk=0;
  const sc=()=>{if(tk||!mid)return;tk=setTimeout(()=>{tk=0;if(location.hash!=='#/r/'+id)return;const im=[...document.querySelectorAll('.rd img')];let k=im.length-1;for(let q=0;q<im.length;q++){if(im[q].getBoundingClientRect().bottom>120){k=q;break}}if(k>=0)saveProg(mid,{p:k})},700)};
  window.addEventListener('scroll',sc,{passive:true});window._sc=sc;
  const rt=$('#rtop');if(rt)rt.onclick=e=>{e.preventDefault();window.scrollTo(0,0)};
  if(resume){
    const im=[...document.querySelectorAll('.rd img')],tg=im[resume];
    Promise.race([Promise.all(im.slice(0,resume+1).map(x=>x.complete?0:new Promise(r=>{x.addEventListener('load',r);x.addEventListener('error',r)}))),new Promise(r=>setTimeout(r,5000))]).then(()=>{if(tg&&location.hash==='#/r/'+id)tg.scrollIntoView()});
  }
}

/* ===== PENGATURAN ===== */
function vSettings(){
  const c=cfg();
  app.innerHTML=`<h2>Pengaturan</h2><div class="f">
  <label class="mu">Bahasa manga</label><select id="s-ml"><option value="id"${mLang()==='id'?' selected':''}>Indonesia</option><option value="en"${mLang()==='en'?' selected':''}>English</option></select>
  <label class="mu">Putar episode berikutnya otomatis</label><select id="s-an"><option value="1"${c.an!==false?' selected':''}>Ya</option><option value="0"${c.an===false?' selected':''}>Tidak</option></select>
  <label class="mu">Mode hemat data (manga)</label><select id="s-ds"><option value="0"${!c.ds?' selected':''}>Mati</option><option value="1"${c.ds?' selected':''}>Hidup</option></select>
  <label class="mu">Muat gambar manga lewat server (aktifkan jika gambar tidak muncul)</label><select id="s-ip"><option value="0"${!c.ip?' selected':''}>Mati</option><option value="1"${c.ip?' selected':''}>Hidup</option></select>
  <button class="btn s" id="s-clr">Hapus riwayat tontonan</button><button class="btn s" id="s-clr2">Hapus progres baca manga</button><button class="btn s" id="s-clr3">Hapus semua favorit</button><p class="mu" id="s-ok"></p></div>`;
  const ok=()=>{$('#s-ok').textContent='Tersimpan ✓'};
  $('#s-ml').onchange=e=>{saveCfg({ml:e.target.value});ok()};
  $('#s-an').onchange=e=>{saveCfg({an:e.target.value==='1'});ok()};
  $('#s-ds').onchange=e=>{saveCfg({ds:e.target.value==='1'});ok()};
  $('#s-ip').onchange=e=>{saveCfg({ip:e.target.value==='1'});ok()};
  $('#s-clr').onclick=()=>{try{localStorage.removeItem('kw')}catch{}$('#s-ok').textContent='Riwayat dihapus ✓'};
  $('#s-clr2').onclick=()=>{try{localStorage.removeItem('kr')}catch{}$('#s-ok').textContent='Progres baca dihapus ✓'};
  $('#s-clr3').onclick=()=>{if(!confirm('Hapus semua favorit?'))return;try{localStorage.removeItem('kf')}catch{}$('#s-ok').textContent='Favorit dihapus ✓'};
}

/* ===== ROUTER ===== */
async function route(){
  const h=location.hash||'#/';
  const p=h.replace(/^#\/?/,'').split('/').map(x=>{try{return decodeURIComponent(x)}catch{return x}});
  if(hls){try{hls.destroy()}catch{}hls=null}
  if(window._kd){window.removeEventListener('keydown',window._kd);window._kd=null}
  if(window._sc){window.removeEventListener('scroll',window._sc);window._sc=null}
  window.nextEp=null;
  setNav();window.scrollTo(0,0);
  try{
    switch(p[0]){
      case'':return await vHome();
      case'a':return await vAnime(p[1]);
      case's':return await vSearch(p.slice(1).join('/'));
      case'm':return p[1]==='t'?await vMangaList(p[2],p[3]):p[1]?await vManga(p[1]):await vMangaHome();
      case'ms':return await vMangaSearch(p.slice(1).join('/'));
      case'r':return await vReader(p[1]);
      case'fav':return vFav(p[1]);
      case'set':return vSettings();
      case'o':
        switch(p[1]){
          case'ongoing':return await vOtaList('ongoing',p[2]);
          case'completed':return await vOtaList('completed',p[2]);
          case'list':return await vOtaAll();
          case'genres':return await vOtaGenres();
          case'g':return await vOtaGenre(p[2],p[3]);
          case'schedule':return await vOtaSchedule();
          case'd':return await vOtaDetail(p[2]);
          case'e':return await vOtaEp(p[2]);
        }
    }
    app.innerHTML='<div class="msg">Halaman tidak ditemukan.<br><br><a class="btn" href="#/">Ke beranda</a></div>';
  }catch(e){console.error(e);app.innerHTML=errBox(e)}
}
$('#sf').addEventListener('submit',e=>{
  e.preventDefault();const q=$('#si').value.trim();if(!q)return;
  const mg=/^#\/(m|ms|r)(\/|$)/.test(location.hash||'#/');
  location.hash=(mg?'#/ms/':'#/s/')+enc(q);
});
window.addEventListener('hashchange',route);
route();
</script>
