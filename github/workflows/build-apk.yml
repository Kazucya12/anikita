name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Pasang Capacitor
        working-directory: android-wrapper
        run: npm install --no-audit --no-fund

      - name: Buat proyek Android
        working-directory: android-wrapper
        run: npx cap add android

      - name: Ikon dan splash
        run: |
          pip install pillow
          python android-wrapper/make_icons.py

      - name: Atur penandatanganan dan versi
        working-directory: android-wrapper/android/app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          cat ../../signing.gradle >> build.gradle

      - name: Build APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Siapkan file
        run: cp android-wrapper/android/app/build/outputs/apk/release/app-release.apk kumori.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kumori-apk
          path: kumori.apk

      - name: Rilis di GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kumori APK #${{ github.run_number }}
          body: |
            Unduh **kumori.apk**, lalu buka di HP Android dan izinkan pemasangan dari sumber ini.
            APK memuat situs Kumori terbaru, jadi pembaruan situs langsung tampil tanpa perlu pasang ulang.
          files: kumori.apk
          make_latest: true
